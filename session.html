<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ensemble — session</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
<style>
  :root { --bg:#0e0e0e; --surface:#161616; --fg:#ededed; --border:#2a2a2a; --accent:#c25d3c; --dim:#9a9a9a; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--fg); font:13px system-ui,-apple-system,sans-serif; }
  header { display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--border); flex:0 0 auto; }
  header h1 { font-size:14px; margin:0; }
  .grow { flex:1; }
  .status { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:2px 8px; border-radius:10px; border:1px solid transparent; }
  .status.active { color:#16a34a; background:#16a34a22; border-color:#16a34a55; }
  .status.waiting_human { color:#eab308; background:#eab30822; border-color:#eab30855; }
  .status.paused { color:#ef4444; background:#ef444422; border-color:#ef444455; }
  .dim { color:var(--dim); font-size:11px; }
  #info { flex:0 0 auto; display:flex; gap:12px; align-items:center; flex-wrap:wrap;
    padding:5px 12px; border-bottom:1px solid var(--border); font-size:11px; color:var(--dim); }
  #info .ib-agent { color:var(--fg); }
  #info .ib-agent.claude { color:#d97757; } #info .ib-agent.codex { color:#10a37f; }
  main { flex:1; display:flex; min-height:0; }
  #chatcol { flex:1; display:flex; flex-direction:column; min-width:0; border-right:1px solid var(--border); }
  #msgs { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px; }
  .msg { border:1px solid var(--border); border-radius:10px; padding:8px 10px; max-width:92%; background:#ffffff08; }
  .msg .from { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; opacity:.85; margin-bottom:3px; }
  .msg.claude { border-color:#d9775755; } .msg.claude .from { color:#d97757; }
  .msg.codex { border-color:#10a37f55; } .msg.codex .from { color:#10a37f; }
  .msg.user { align-self:flex-end; border-color:var(--accent); background:#c25d3c1a; }
  .msg .text { white-space:pre-wrap; word-break:break-word; line-height:1.45; }
  /* Markdown-rendered bubble content (see mdToHtml). */
  .msg .text.md { white-space:normal; line-height:1.5; }
  .msg .text.md .ln { white-space:pre-wrap; word-break:break-word; margin:0 0 1px; }
  .msg .text.md ul, .msg .text.md ol { margin:4px 0; padding-left:20px; }
  .msg .text.md li { margin:1px 0; }
  .msg .text.md h3 { font-size:15px; font-weight:700; margin:13px 0 6px; padding-bottom:3px; border-bottom:1px solid var(--border); }
  .msg .text.md h4 { font-size:13px; font-weight:700; margin:11px 0 4px; }
  .msg .text.md h5, .msg .text.md h6 { font-size:12px; font-weight:700; margin:9px 0 3px; }
  .msg .text.md > :first-child { margin-top:0; }
  .msg .text.md .ln-gap { height:.6em; }
  .msg .text.md code.ic { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.9em; background:#ffffff14; border:1px solid #ffffff24; border-radius:4px; padding:0 4px; word-break:break-word; }
  .msg .text.md pre.cb { margin:6px 0; background:#0b0b0b; border:1px solid var(--border); border-radius:8px; padding:8px 10px; overflow-x:auto; }
  .msg .text.md pre.cb code { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; line-height:1.45; white-space:pre; }
  .msg .text.md pre.cb[data-lang]::before { content:attr(data-lang); display:block; font-size:9px; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); margin-bottom:5px; }
  .msg .text.md blockquote { margin:4px 0; padding:2px 10px; border-left:3px solid var(--border); color:var(--dim); }
  .msg .text.md a { color:var(--accent); }
  .msg .text.md hr { border:0; border-top:1px solid var(--border); margin:8px 0; }
  .msg .text.md table { border-collapse:collapse; margin:8px 0; display:block; overflow-x:auto; max-width:100%; }
  .msg .text.md th, .msg .text.md td { border:1px solid var(--border); padding:4px 8px; text-align:left; vertical-align:top; }
  .msg .text.md th { background:#ffffff12; font-weight:700; }
  /* In-place review comments */
  mark.cmt-hl { background:#f5c84240; border-bottom:2px solid #f5c842; border-radius:2px; color:inherit; cursor:pointer; }
  .cmt-selbtn { position:fixed; z-index:60; font-size:12px; padding:5px 11px; background:var(--accent); color:#fff; border:none; border-radius:6px; box-shadow:0 3px 12px rgba(0,0,0,.4); cursor:pointer; }
  .cmt-composer { position:fixed; z-index:61; top:50%; left:50%; transform:translate(-50%,-50%); width:min(440px,92vw); background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:0 14px 44px rgba(0,0,0,.55); padding:14px; }
  .cmt-composer .cmt-quote { font-size:12px; color:var(--dim); border-left:3px solid var(--accent); padding:5px 9px; margin-bottom:9px; max-height:96px; overflow-y:auto; white-space:pre-wrap; }
  .cmt-composer textarea { width:100%; background:var(--bg); color:var(--fg); border:1px solid var(--border); border-radius:6px; padding:8px; font:inherit; resize:vertical; }
  .cmt-composer .cmt-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:10px; }
  .cmt-composer .cmt-add { background:var(--accent); color:#fff; border:none; }
  #cmt-tray { position:fixed; right:12px; bottom:12px; z-index:55; width:min(330px,92vw); max-height:60vh; display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:0 10px 34px rgba(0,0,0,.45); overflow:hidden; }
  #cmt-tray .cmt-tray-head { display:flex; align-items:center; gap:6px; padding:9px 11px; border-bottom:1px solid var(--border); font-size:13px; }
  #cmt-tray .grow { flex:1; }
  #cmt-tray .cmt-submit { background:var(--accent); color:#fff; border:none; padding:4px 12px; border-radius:6px; cursor:pointer; font:inherit; font-size:12px; }
  #cmt-tray .cmt-clear { font-size:12px; padding:4px 10px; }
  #cmt-tray .cmt-list { overflow-y:auto; }
  #cmt-tray .cmt-item { position:relative; padding:8px 26px 8px 11px; border-bottom:1px solid var(--border); cursor:pointer; }
  #cmt-tray .cmt-item:hover { background:#ffffff08; }
  #cmt-tray .cmt-item-q { font-size:11px; color:var(--accent); margin-bottom:2px; word-break:break-word; }
  #cmt-tray .cmt-item-n { font-size:12px; color:var(--fg); word-break:break-word; }
  #cmt-tray .cmt-item-x { position:absolute; top:6px; right:6px; background:none; border:none; color:var(--dim); cursor:pointer; font-size:12px; padding:2px 5px; }
  #cmt-tray .cmt-item-x:hover { color:#ef4444; }
  .to { font-weight:400; opacity:.6; text-transform:none; }
  #compose { border-top:1px solid var(--border); padding:10px; display:flex; flex-direction:column; gap:6px; flex:0 0 auto; }
  #compose textarea { width:100%; min-height:48px; resize:vertical; background:var(--surface); color:var(--fg); border:1px solid var(--border); border-radius:6px; padding:6px; font:inherit; }
  #agentcol { flex:0 0 46%; display:flex; flex-direction:column; min-width:0; overflow-y:auto; }
  .agent { border-bottom:1px solid var(--border); }
  .agent .ah { display:flex; align-items:center; gap:8px; padding:8px 10px; cursor:pointer; user-select:none; }
  .agent .ah:hover { background:#ffffff08; }
  .agent .ah .nm { font-weight:700; }
  .adot { font-size:10px; color:#6b7280; }
  .adot.working { color:#16a34a; } .adot.idle { color:#6b7280; } .adot.dead { color:#ef4444; }
  .astat { font-size:11px; }
  .agent .term { height:300px; display:none; background:var(--term-bg, #0b0b0b); padding:4px; }
  .agent.open .term { display:block; }
  /* Solo session: one agent, driven directly — hide the chat, terminal fills. */
  body.solo #chatcol { display:none; }
  body.solo #agentcol { flex:1; }
  body.solo .agent { border-bottom:none; height:100%; display:flex; flex-direction:column; }
  body.solo .agent .ah { cursor:default; }
  body.solo .agent .ah .toggle { display:none; }
  body.solo .agent .term { display:block; flex:1; height:auto; }
  button { background:#2a2a2a; color:var(--fg); border:1px solid #444; padding:4px 12px; border-radius:6px; cursor:pointer; font:inherit; }
  button:hover { background:#333; }
  /* Embedded in the dashboard's detail panel: the parent card owns the title,
     info and actions, so drop our own header/info bar and just be the surface. */
  body.embed > header, body.embed > #info { display:none; }
  /* A not-running solo session still shows its stored transcript (don't collapse
     the chat column to a blank terminal). */
  body.solo.notrunning #chatcol { display:flex; }
  body.solo.notrunning #agentcol { display:none; }
  /* Collaboration: the raw per-agent terminals duplicate the chat and eat width
     (badly on phones), so they're hidden by default. The header "Terminals"
     button toggles them; solo mode always shows its terminal. */
  body:not(.solo).term-hidden #agentcol { display:none; }
  body:not(.solo).term-hidden #chatcol { border-right:none; }
  #terms.on { background:var(--accent); border-color:var(--accent); color:#fff; }
</style>
</head>
<body>
<header>
  <h1 id="title">session</h1>
  <span id="status" class="status"></span>
  <span id="hop" class="dim"></span>
  <span class="grow"></span>
  <button id="dock" hidden title="Dock this session back into the dashboard panel">⧉ Dock</button>
  <button id="resume" hidden title="Relaunch the agent(s) with their conversation">↻ Resume</button>
  <button id="terms" hidden title="Show/hide the raw per-agent terminals">🖥 Terminals</button>
  <button id="pause">Pause</button>
  <button id="end" title="Stop the agent(s) and end this session">End</button>
</header>
<div id="info"></div>
<main>
  <div id="chatcol">
    <div id="msgs"></div>
    <div id="compose">
      <div class="dim" id="hint"></div>
      <textarea id="input" placeholder="Message the agents — Ctrl+Enter to send. Start with @codex or @claude to direct it to one."></textarea>
      <div style="display:flex; gap:8px; align-items:center">
        <span class="dim">To</span>
        <select id="to"><option value="">Everyone</option></select>
        <button id="send">Send</button>
      </div>
    </div>
  </div>
  <div id="agentcol"></div>
</main>
<script>
const qs = new URLSearchParams(location.search);
const ROOM = qs.get('id');
if (qs.get('embed')) document.body.classList.add('embed');
document.body.classList.add('term-hidden');   // raw agent terminals off by default
const $ = s => document.querySelector(s);
const esc = s => (s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Minimal, self-contained markdown → HTML for chat bubbles. Escape-first so it's
// XSS-safe: fenced/inline code is pulled out to placeholders, the rest is escaped,
// then inline spans + block structure are applied, then code is restored (escaped).
// A local file path (drive-letter, UNC, ~, or absolute) ending in an extension.
const looksFilePath = s => /^(?:[A-Za-z]:\\|\\\\|~\/|\/)\S+\.\w{1,8}$/.test((s || '').trim());
const fileHref = p => '/fileview?path=' + encodeURIComponent(p) + (ROOM ? '&room=' + encodeURIComponent(ROOM) : '');
function mdToHtml(src) {
  const codes = [];
  let s = (src ?? '').replace(/\r\n/g, '\n');
  // Fenced code blocks ```lang\n...\n```
  s = s.replace(/```([\w+-]*)\n?([\s\S]*?)```/g, (_, lang, body) => {
    const i = codes.push(`<pre class="cb"${lang ? ` data-lang="${esc(lang)}"` : ''}><code>${esc(body.replace(/\n$/, ''))}</code></pre>`) - 1;
    return `␀B${i}␀`;
  });
  // Inline code `...`
  s = s.replace(/`([^`\n]+)`/g, (_, body) => {
    const code = `<code class="ic">${esc(body)}</code>`;
    const i = codes.push(looksFilePath(body) ? `<a href="${fileHref(body.trim())}" target="_blank" rel="noopener">${code}</a>` : code) - 1;
    return `␀I${i}␀`;
  });
  s = esc(s);
  // Inline spans (operate on escaped text; placeholders are safe).
  const inline = t => t
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, (_, txt, url) => `<a href="${esc(url)}" target="_blank" rel="noopener">${txt}</a>`)
    .replace(/(^|[\s(])((?:https?:\/\/)[^\s<)]+)/g, (_, pre, url) => `${pre}<a href="${url}" target="_blank" rel="noopener">${url}</a>`)
    .replace(/(^|[\s(])((?:[A-Za-z]:\\|\\\\|~\/|\/)[^\s"'<>|?*,;)\]]*\.\w{1,8})/g,
      (_, pre, pth) => `${pre}<a href="${fileHref(pth)}" target="_blank" rel="noopener" class="file-link">${pth}</a>`)
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?]|$)/g, '$1<em>$2</em>')
    .replace(/(^|[\s(])_([^_\n]+)_(?=[\s).,!?]|$)/g, '$1<em>$2</em>');
  // Block structure, line by line.
  const lines = s.split('\n');
  const out = [];
  let list = null; // 'ul' | 'ol'
  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  const tableSep = l => /^[\s|:-]+$/.test(l.trim()) && l.includes('|') && l.includes('-');
  const rowCells = l => { let r = l.trim(); if (r.startsWith('|')) r = r.slice(1); if (r.endsWith('|')) r = r.slice(0, -1); return r.split('|').map(c => c.trim()); };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (/^␀B\d+␀$/.test(line.trim())) { closeList(); out.push(line.trim()); continue; }
    let m;
    if (line.includes('|') && i + 1 < lines.length && tableSep(lines[i + 1])) {
      closeList();
      const heads = rowCells(line);
      const aligns = rowCells(lines[i + 1]).map(c => { const L = c.startsWith(':'), R = c.endsWith(':'); return (L && R) ? 'center' : R ? 'right' : L ? 'left' : ''; });
      const body = [];
      let j = i + 2;
      while (j < lines.length && lines[j].includes('|') && lines[j].trim() !== '') { body.push(rowCells(lines[j])); j++; }
      const cell = (c, tag, al) => `<${tag}${al ? ` style="text-align:${al}"` : ''}>${inline(c || '')}</${tag}>`;
      let tbl = '<table><thead><tr>' + heads.map((h, k) => cell(h, 'th', aligns[k])).join('') + '</tr></thead>';
      if (body.length) tbl += '<tbody>' + body.map(row => '<tr>' + heads.map((_, k) => cell(row[k], 'td', aligns[k])).join('') + '</tr>').join('') + '</tbody>';
      out.push(tbl + '</table>');
      i = j - 1;
      continue;
    }
    if ((m = line.match(/^(#{1,4})\s+(.*)$/))) { closeList(); const n = m[1].length + 2; out.push(`<h${n}>${inline(m[2])}</h${n}>`); continue; }
    if (/^\s*([-*_])\1{1,}\s*$/.test(line)) { closeList(); out.push('<hr>'); continue; }
    if ((m = line.match(/^\s*>\s?(.*)$/))) { closeList(); out.push(`<blockquote>${inline(m[1])}</blockquote>`); continue; }
    if ((m = line.match(/^\s*[-*+]\s+(.*)$/))) { if (list !== 'ul') { closeList(); out.push('<ul>'); list = 'ul'; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { if (list !== 'ol') { closeList(); out.push('<ol>'); list = 'ol'; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    if (line.trim() === '') { closeList(); if (out.length && out[out.length - 1] !== '<div class="ln-gap"></div>') out.push('<div class="ln-gap"></div>'); continue; }
    closeList(); out.push(`<div class="ln">${inline(line)}</div>`);
  }
  closeList();
  let html = out.join('\n');
  html = html.replace(/␀([BI])(\d+)␀/g, (_, __, i) => codes[+i]);
  return html;
}
const tildeify = p => (p || '').replace(/^[A-Za-z]:\\Users\\[^\\]+/i, '~').replace(/^\/(Users|home)\/[^/]+/, '~');
const jpost = (path, body) => fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) }).then(r=>r.json());
const b64bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
// Strip terminal query REPLIES (fg/bg color = OSC 10/11, device attributes =
// CSI ? … c) that some PTY/ConPTY setups leak into the output as literal text.
function cleanSeq(s) {
  return s
    .replace(/\x1b?\]1[01];rgb:[0-9a-f\/]+(?:\x1b\\|\x07|\\)/gi, '')
    .replace(/\x1b?\[\?[0-9;]+c/g, '');
}

const terms = {};          // ptyId -> {term, es}
let agentsBuilt = false;

// --- chat-window theming -------------------------------------------------
// A headless session has no OS terminal tab, so the chosen color scheme is
// applied to the chat window here: the scheme's background/foreground recolor
// the session view live (no relaunch). Re-checked each refresh; only re-applied
// when the scheme actually changes.
let THEME_NAME = null;
let CUR_COLORS = null;     // full scheme palette, for xterm + chat
async function ensureTheme(cwd) {
  if (!cwd) return;
  let t;
  try { t = await fetch('/api/theme-colors?cwd=' + encodeURIComponent(cwd)).then(r => r.json()); }
  catch (e) { return; }
  const name = (t && t.theme) || '';
  if (name === (THEME_NAME || '')) return;
  THEME_NAME = name;
  applyTheme((t && t.colors) || {});
}
// Build an xterm.js theme from the scheme — the terminal IS the chat window for
// a solo session, so it takes the full ANSI palette, not just bg/fg.
function xtermThemeFrom(c) {
  if (!c || !c.background) return { background: '#0b0b0b' };
  const th = {
    background: c.background, foreground: c.foreground || '#ededed',
    cursor: c.cursor || c.foreground || '#ededed', cursorAccent: c.background,
    black: c.black, red: c.red, green: c.green, yellow: c.yellow, blue: c.blue,
    magenta: c.magenta, cyan: c.cyan, white: c.white,
    brightBlack: c.brightBlack, brightRed: c.brightRed, brightGreen: c.brightGreen,
    brightYellow: c.brightYellow, brightBlue: c.brightBlue, brightMagenta: c.brightMagenta,
    brightCyan: c.brightCyan, brightWhite: c.brightWhite,
  };
  if (c.selection) th.selectionBackground = c.selection;
  return th;
}
function applyTheme(c) {
  const s = document.documentElement.style;
  const vars = ['--bg', '--surface', '--fg', '--border', '--dim', '--accent', '--term-bg'];
  CUR_COLORS = (c && c.background && c.foreground) ? c : null;
  if (CUR_COLORS) {
    const bg = c.background, fg = c.foreground;
    s.setProperty('--bg', bg);
    s.setProperty('--fg', fg);
    s.setProperty('--surface', `color-mix(in srgb, ${fg} 7%, ${bg})`);
    s.setProperty('--border', `color-mix(in srgb, ${fg} 20%, ${bg})`);
    s.setProperty('--dim', `color-mix(in srgb, ${fg} 55%, ${bg})`);
    s.setProperty('--term-bg', bg);
    if (c.blue) s.setProperty('--accent', c.blue);
  } else {
    vars.forEach(v => s.removeProperty(v));   // no scheme → revert to defaults
  }
  // Repaint every mounted terminal with the new palette (live, no relaunch).
  const xt = xtermThemeFrom(CUR_COLORS);
  Object.values(terms).forEach(t => { try { t.term.options.theme = xt; } catch (e) {} });
}

function buildAgents(room) {
  const col = $('#agentcol'); col.innerHTML = '';
  room.participants.filter(p => p.kind === 'agent').forEach(p => {
    const div = document.createElement('div');
    div.className = 'agent';
    div.innerHTML = `<div class="ah"><span class="adot" data-pty="${esc(p.ptyId||'')}">●</span> `
      + `<span class="nm">${esc(p.identity)}</span>`
      + `<span class="dim">${esc(p.agent)}${p.model ? ' · ' + esc(p.model) : ''}</span>`
      + `<span class="astat dim" data-pty="${esc(p.ptyId||'')}"></span>`
      + `<span class="grow"></span><span class="dim toggle">▸ terminal</span></div>`
      + `<div class="term"></div>`;
    div.querySelector('.ah').onclick = () => toggleTerm(div, p.ptyId);
    col.appendChild(div);
  });
  // Populate the "To" picker: Everyone + each agent (directed message).
  const sel = $('#to');
  const keep = sel.value;
  sel.innerHTML = '<option value="">Everyone</option>' +
    room.participants.filter(p => p.kind === 'agent')
      .map(p => `<option value="${esc(p.identity)}">${esc(p.identity)}</option>`).join('');
  sel.value = keep;
  // Solo session: auto-open the single agent's terminal (it's the main view).
  const agentDivs = col.querySelectorAll('.agent');
  if (agentDivs.length === 1) {
    const div = agentDivs[0];
    const p = room.participants.find(x => x.kind === 'agent');
    div.classList.add('open');
    const tog = div.querySelector('.toggle'); if (tog) tog.textContent = '▾ terminal';
    if (p && p.ptyId && !terms[p.ptyId]) mountTerm(div.querySelector('.term'), p.ptyId);
  }
  agentsBuilt = true;
}
function toggleTerm(div, ptyId) {
  const open = div.classList.toggle('open');
  div.querySelector('.toggle').textContent = open ? '▾ terminal' : '▸ terminal';
  if (open && ptyId && !terms[ptyId]) mountTerm(div.querySelector('.term'), ptyId);
  else if (open && terms[ptyId]) syncSize(ptyId);
}
// Match the PTY's size to the rendered xterm, else the agent's absolute cursor
// positioning lands wrong and the layout looks garbled.
function syncSize(ptyId) {
  const t = terms[ptyId]; if (!t) return;
  try { t.fit && t.fit.fit(); } catch(e) {}
  jpost('/api/pty/resize', { id: ptyId, rows: t.term.rows, cols: t.term.cols });
}
function mountTerm(el, ptyId) {
  const term = new Terminal({
    fontSize: 13, convertEol: false, scrollback: 8000, cursorBlink: true,
    fontFamily: 'Consolas, "Cascadia Mono", "DejaVu Sans Mono", monospace',
    theme: xtermThemeFrom(CUR_COLORS),
  });
  let fit = null;
  try { fit = new FitAddon.FitAddon(); term.loadAddon(fit); } catch(e) {}
  term.open(el);
  // Copy (Ctrl+Shift+C) / paste (Ctrl+Shift+V or right-click). The app itself
  // uses plain Ctrl+C/V, so the shift variants are the terminal's — like a real
  // terminal.
  term.attachCustomKeyEventHandler((e) => {
    if (e.type !== 'keydown' || !(e.ctrlKey && e.shiftKey)) return true;
    if (e.code === 'KeyC') {
      const sel = term.getSelection();
      if (sel) { e.preventDefault(); navigator.clipboard.writeText(sel).catch(() => {}); return false; }
    }
    if (e.code === 'KeyV') {
      // preventDefault stops the browser's OWN paste action — without it the
      // clipboard lands twice (once here, once via xterm's native paste event).
      e.preventDefault();
      navigator.clipboard.readText().then(t => term.paste(t)).catch(() => {});
      return false;
    }
    return true;
  });
  el.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    navigator.clipboard.readText().then(t => term.paste(t)).catch(() => {});
  });
  const td = new TextDecoder();
  const es = new EventSource('/api/pty/stream?id=' + encodeURIComponent(ptyId));
  es.onmessage = ev => term.write(cleanSeq(td.decode(b64bytes(ev.data), { stream: true })));
  term.onData(d => jpost('/api/pty/input', { id: ptyId, data: d }));
  terms[ptyId] = { term, es, fit };
  // Size the PTY to the terminal once it has laid out; focus it for typing.
  setTimeout(() => { syncSize(ptyId); term.focus(); }, 60);
  try { new ResizeObserver(() => syncSize(ptyId)).observe(el); } catch(e) {}
}

function renderMsgs(room) {
  const box = $('#msgs');
  // Don't blow away the DOM while the user is mid-comment (it would drop their
  // selection / the open composer). Highlights are re-applied after each render.
  if (_cmtComposerOpen || _selBtn) return;
  const _liveSel = window.getSelection();
  if (_liveSel && !_liveSel.isCollapsed && _liveSel.rangeCount &&
      box.contains(_liveSel.getRangeAt(0).commonAncestorContainer)) return;
  const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 50;
  box.innerHTML = room.messages.map(m => {
    const cls = m.from === 'user' ? 'user' : esc(m.from);
    const to = m.to && m.to !== 'all' ? ` <span class="to">→ ${esc(m.to)}</span>` : '';
    return `<div class="msg ${cls}" data-mid="${esc(m.id || '')}" data-from="${esc(m.from || '')}"><div class="from">${esc(m.from)}${to}</div><div class="text md">${mdToHtml(m.text)}</div></div>`;
  }).join('');
  if (atBottom) box.scrollTop = box.scrollHeight;
  applyComments();
}

async function refresh() {
  let room;
  try { room = await fetch('/api/room?id=' + encodeURIComponent(ROOM)).then(r => r.json()); }
  catch(e) { return; }
  if (!room || room.error) { $('#title').textContent = '(session not found)'; return; }
  document.title = room.title + ' — session';
  $('#title').textContent = room.title;
  const st = room.status || '';
  const notRunning = room.live === false;
  const sb = $('#status');
  sb.className = 'status ' + (notRunning ? '' : st);
  sb.textContent = notRunning ? 'not running' : st.replace('_', ' ');
  $('#hop').textContent = notRunning ? '' : `hop ${room.hopCount || 0}/${room.maxHops || 0}`;
  $('#hint').textContent = notRunning
    ? 'Not running — Resume to continue where it left off.'
    : (st === 'waiting_human' || st === 'paused')
      ? 'The agents are waiting for you — reply to resume.' : '';
  $('#send').disabled = notRunning;
  $('#input').disabled = notRunning;
  $('#resume').hidden = !notRunning;
  const pb = $('#pause');
  pb.style.display = notRunning ? 'none' : '';
  pb.textContent = st === 'paused' ? 'Resume' : 'Pause';
  pb.onclick = () => jpost('/api/room/status', { roomId: ROOM, status: st === 'paused' ? 'active' : 'paused' }).then(refresh);
  const soloMode = room.mode === 'solo' ||
    room.participants.filter(p => p.kind === 'agent').length === 1;
  document.body.classList.toggle('solo', soloMode);
  document.body.classList.toggle('notrunning', notRunning);
  // Basic session info (parity with a single-agent's detail view).
  const mem = room.participants.filter(p => p.kind === 'agent');
  const cwd = room.cwd || '';
  ensureTheme(cwd);
  $('#info').innerHTML =
    (cwd ? `<span title="${esc(cwd)}">📁 ${esc(tildeify(cwd))}</span>` : '')
    + mem.map(m => `<span class="ib-agent ${esc(m.agent)}" title="${esc(m.identity)}">${esc(m.agent)}${m.model ? ' · ' + esc(m.model) : ''}</span>`).join('')
    + (soloMode ? '' : `<span>${room.messages.length} messages · hop ${room.hopCount || 0}/${room.maxHops || 0}</span>`);
  const showTerms = soloMode || !document.body.classList.contains('term-hidden');
  $('#terms').hidden = soloMode || notRunning;
  $('#terms').classList.toggle('on', !document.body.classList.contains('term-hidden'));
  if (!agentsBuilt && showTerms && room.participants.some(p => p.kind === 'agent' && p.ptyId)) buildAgents(room);
  if (!soloMode || notRunning) renderMsgs(room);
  if (showTerms) updateAgentStatus();
}

// Live per-agent status dot: working (recent output) / idle / stopped.
async function updateAgentStatus() {
  let ptys = [];
  try { ptys = await fetch('/api/ptys').then(r => r.json()); } catch(e) { return; }
  const map = {};
  ptys.forEach(x => map[x.id] = x);
  document.querySelectorAll('.adot').forEach(dot => {
    const info = map[dot.dataset.pty];
    let cls = 'dead', txt = 'stopped';
    if (info && info.alive) {
      if (info.idleSeconds < 2.5) { cls = 'working'; txt = 'working…'; }
      else { cls = 'idle'; txt = 'idle'; }
    }
    dot.className = 'adot ' + cls;
    const stat = document.querySelector('.astat[data-pty="' + dot.dataset.pty + '"]');
    if (stat) stat.textContent = txt;
  });
}
$('#send').onclick = async () => {
  const t = $('#input').value.trim(); if (!t) return;
  let to = $('#to') ? $('#to').value : '';
  // A leading @<identity> overrides the To picker: "@codex do X" → codex only.
  const m = t.match(/^@([\w-]+)\b/);
  if (m) {
    const idents = $('#to') ? [...$('#to').options].map(o => o.value) : [];
    if (idents.includes(m[1]) || m[1] === 'user') to = m[1];
  }
  await jpost('/api/room/say', { roomId: ROOM, text: t, to });
  $('#input').value = ''; if ($('#to')) $('#to').value = ''; refresh();
};
$('#input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $('#send').click(); }
});
$('#terms').onclick = () => {
  const hidden = document.body.classList.toggle('term-hidden');
  $('#terms').classList.toggle('on', !hidden);
  if (!hidden) refresh();   // revealing → build/stream the terminals now
};

// ---- In-place review comments -------------------------------------------
// Select text inside an agent bubble → attach a comment; collect several across
// a long message; submit them all as one structured reply. Comments live in the
// browser until submitted, and their highlights are re-applied after each poll.
const COMMENTS = [];        // {cid, mid, from, start, end, quote, note}
let _cmtSeq = 1;
let _cmtComposerOpen = false;
let _selBtn = null;

function _offsetInEl(root, node, nodeOffset) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  let off = 0, n;
  while ((n = w.nextNode())) {
    if (n === node) return off + nodeOffset;
    off += n.nodeValue.length;
  }
  return -1;
}
function _markRange(root, start, end, cid) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  let off = 0, n; const targets = [];
  while ((n = w.nextNode())) {
    const len = n.nodeValue.length;
    const s = Math.max(start, off), e = Math.min(end, off + len);
    if (s < e) targets.push({ node: n, s: s - off, e: e - off });
    off += len;
  }
  for (const t of targets.reverse()) {           // back-to-front keeps offsets valid
    try {
      const r = document.createRange();
      r.setStart(t.node, t.s); r.setEnd(t.node, t.e);
      const mk = document.createElement('mark');
      mk.className = 'cmt-hl'; mk.dataset.cid = cid;
      r.surroundContents(mk);
    } catch (e) {}
  }
}
function clearHighlights() {
  document.querySelectorAll('#msgs mark.cmt-hl').forEach(mk => {
    const p = mk.parentNode;
    while (mk.firstChild) p.insertBefore(mk.firstChild, mk);
    p.removeChild(mk); p.normalize();
  });
}
function applyComments() {
  for (const c of COMMENTS) {
    const el = document.querySelector(`#msgs .msg[data-mid="${c.mid}"] .text`);
    if (!el || el.querySelector(`mark.cmt-hl[data-cid="${c.cid}"]`)) continue;
    _markRange(el, c.start, c.end, c.cid);
  }
  renderCmtTray();
}
function hideSelBtn() { if (_selBtn) { _selBtn.remove(); _selBtn = null; } }

function _onSelect() {
  setTimeout(() => {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) { hideSelBtn(); return; }
    const range = sel.getRangeAt(0);
    const a = range.startContainer.parentElement?.closest('.msg .text.md');
    const b = range.endContainer.parentElement?.closest('.msg .text.md');
    if (!a || a !== b) { hideSelBtn(); return; }   // selection must sit in one bubble
    let start = _offsetInEl(a, range.startContainer, range.startOffset);
    let end = _offsetInEl(a, range.endContainer, range.endOffset);
    if (start > end) { const t = start; start = end; end = t; }
    if (start < 0 || end <= start) { hideSelBtn(); return; }
    const msgEl = a.closest('.msg');
    const data = { mid: msgEl.dataset.mid, from: msgEl.dataset.from, start, end,
                   quote: (a.textContent || '').slice(start, end) };
    const rect = range.getBoundingClientRect();
    showSelBtn(rect, data);
  }, 10);
}
function showSelBtn(rect, data) {
  hideSelBtn();
  const btn = document.createElement('button');
  btn.className = 'cmt-selbtn'; btn.textContent = '💬 Comment';
  document.body.appendChild(btn);
  const top = rect.bottom + 6, left = Math.min(rect.left, window.innerWidth - 130);
  btn.style.top = top + 'px'; btn.style.left = Math.max(6, left) + 'px';
  btn.addEventListener('mousedown', e => e.preventDefault());  // keep the selection
  btn.onclick = () => { hideSelBtn(); openComposer(data); };
  _selBtn = btn;
}
function openComposer(data) {
  _cmtComposerOpen = true;
  const q = data.quote.length > 200 ? data.quote.slice(0, 200) + '…' : data.quote;
  const pop = document.createElement('div');
  pop.className = 'cmt-composer';
  pop.innerHTML = `<div class="cmt-quote"></div>
    <textarea class="cmt-note" rows="3" placeholder="Your comment on this passage…"></textarea>
    <div class="cmt-actions"><button class="cmt-cancel">Cancel</button><button class="cmt-add">Add comment</button></div>`;
  pop.querySelector('.cmt-quote').textContent = '“' + q + '”';
  document.body.appendChild(pop);
  const ta = pop.querySelector('.cmt-note'); ta.focus();
  const close = () => { pop.remove(); _cmtComposerOpen = false; };
  pop.querySelector('.cmt-cancel').onclick = close;
  pop.querySelector('.cmt-add').onclick = () => {
    const note = ta.value.trim(); if (!note) { ta.focus(); return; }
    const cid = _cmtSeq++;
    COMMENTS.push({ cid, mid: data.mid, from: data.from, start: data.start, end: data.end, quote: data.quote, note });
    const el = document.querySelector(`#msgs .msg[data-mid="${data.mid}"] .text`);
    if (el) _markRange(el, data.start, data.end, cid);
    close();
    renderCmtTray();
    const s = window.getSelection(); if (s) s.removeAllRanges();
  };
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); pop.querySelector('.cmt-add').click(); }
    if (e.key === 'Escape') { e.preventDefault(); close(); }
  });
}
function renderCmtTray() {
  let tray = document.getElementById('cmt-tray');
  if (!COMMENTS.length) { if (tray) tray.remove(); return; }
  if (!tray) { tray = document.createElement('div'); tray.id = 'cmt-tray'; document.body.appendChild(tray); }
  tray.innerHTML = `<div class="cmt-tray-head"><strong>${COMMENTS.length} comment${COMMENTS.length > 1 ? 's' : ''}</strong><span class="grow"></span><button class="cmt-submit">Submit</button><button class="cmt-clear">Clear</button></div><div class="cmt-list"></div>`;
  const list = tray.querySelector('.cmt-list');
  COMMENTS.forEach(c => {
    const item = document.createElement('div');
    item.className = 'cmt-item'; item.dataset.cid = c.cid;
    const q = document.createElement('div'); q.className = 'cmt-item-q';
    q.textContent = '“' + (c.quote.length > 60 ? c.quote.slice(0, 60) + '…' : c.quote) + '”';
    const nn = document.createElement('div'); nn.className = 'cmt-item-n'; nn.textContent = c.note;
    const x = document.createElement('button'); x.className = 'cmt-item-x'; x.textContent = '✕'; x.title = 'Remove';
    item.append(q, nn, x);
    x.onclick = (e) => { e.stopPropagation(); const i = COMMENTS.findIndex(z => z.cid === c.cid); if (i >= 0) COMMENTS.splice(i, 1); clearHighlights(); applyComments(); };
    item.onclick = () => { const mk = document.querySelector(`#msgs mark.cmt-hl[data-cid="${c.cid}"]`); if (mk) mk.scrollIntoView({ behavior: 'smooth', block: 'center' }); };
    list.appendChild(item);
  });
  tray.querySelector('.cmt-submit').onclick = submitComments;
  tray.querySelector('.cmt-clear').onclick = () => { COMMENTS.length = 0; clearHighlights(); renderCmtTray(); };
}
async function submitComments() {
  if (!COMMENTS.length) return;
  const authors = [...new Set(COMMENTS.map(c => c.from))];
  const to = authors.length === 1 ? authors[0] : '';
  const body = `## Review comments (${COMMENTS.length})\n\n` +
    COMMENTS.map((c, i) => `**${i + 1}.** > ${c.quote.replace(/\s*\n\s*/g, ' ').trim()}\n\n${c.note}`).join('\n\n');
  try {
    await jpost('/api/room/say', { roomId: ROOM, text: body, to });
    COMMENTS.length = 0; clearHighlights(); renderCmtTray(); refresh();
  } catch (e) { alert('Failed to submit comments — try again.'); }
}
$('#msgs').addEventListener('mouseup', _onSelect);
$('#msgs').addEventListener('touchend', _onSelect);
$('#msgs').addEventListener('mousedown', () => hideSelBtn());
document.addEventListener('mousedown', e => { if (_selBtn && e.target !== _selBtn) hideSelBtn(); });
$('#end').onclick = async () => {
  if (!confirm('End this session and stop the agent(s)?')) return;
  try { await jpost('/api/room/close', { roomId: ROOM }); } catch(e) {}
  window.close();
};
$('#resume').onclick = async () => {
  $('#resume').disabled = true;
  try {
    await jpost('/api/room/resume', { roomId: ROOM });
    // ptyIds changed → tear down the dead terminals and rebuild.
    Object.values(terms).forEach(t => { try { t.es.close(); } catch(e) {} });
    for (const k in terms) delete terms[k];
    agentsBuilt = false;
    await refresh();
  } catch (e) { /* stay ended */ }
  $('#resume').disabled = false;
};
// In a solo session the terminal is the main surface — refocus it when the
// window regains focus so you can just start typing.
window.addEventListener('focus', () => {
  if (!document.body.classList.contains('solo')) return;
  const t = Object.values(terms)[0];
  if (t) { try { t.term.focus(); } catch (e) {} }
});
// Floating window (opened by the dashboard) → offer "Dock" to move it back into
// the panel. When embedded as the panel's iframe, this is hidden (the panel has
// its own "Pop out").
const inIframe = window.parent !== window;
if (!inIframe && window.opener) {
  const dockBtn = $('#dock');
  dockBtn.hidden = false;
  dockBtn.onclick = () => {
    try { window.opener.postMessage({ type: 'dock-session', roomId: ROOM }, '*'); } catch (e) {}
    window.close();
  };
}
if (!ROOM) { $('#title').textContent = '(no session id)'; }
else { refresh(); setInterval(refresh, 2000); }
</script>
