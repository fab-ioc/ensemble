<script>
// Appearance, resolved before first paint so the page never flashes the wrong
// theme. A theme is a complete token set under :root[data-theme="<name>"].
// Light is the default whatever the OS says; "system" follows the OS between
// Light and Dark. The choice follows the person, not the browser: it lives on
// the hub (settings.theme), and localStorage['cd-theme'] is only its
// first-paint cache. index.html, session.html and fileview.html carry the same
// script; change all three together.
(function () {
  var SCHEME = { light: 'light', dark: 'dark', dim: 'dark', paper: 'light', contrast: 'light', fjord: 'dark', 'intellij-dark': 'dark' };
  var mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
  function stored() {
    try { return localStorage.getItem('cd-theme') || 'light'; } catch (e) { return 'light'; }
  }
  function apply() {
    var pref = stored();
    var name = pref === 'system' ? (mq && mq.matches ? 'dark' : 'light') : (SCHEME[pref] ? pref : 'light');
    var root = document.documentElement;
    root.dataset.theme = name;
    root.dataset.scheme = SCHEME[name];
    try { window.dispatchEvent(new CustomEvent('cd-theme', { detail: { pref: pref, theme: name } })); } catch (e) {}
  }
  // The accent colour follows the person the same way: settings.accent on the
  // hub, localStorage['cd-accent'] its first-paint cache. Nothing stored, or
  // the hub's "default", keeps the theme's own accent. The text on a custom
  // accent is picked from the accent itself, so a primary button stays
  // readable in every theme (dark themes put dark text on their pale accent).
  var ink = null;
  function storedAccent() {
    try { return localStorage.getItem('cd-accent') || ''; } catch (e) { return ''; }
  }
  // [r, g, b] of an opaque CSS colour, or null when the browser does not take
  // it or it is see-through (no text colour is sure to read on that).
  function rgbOf(color) {
    try {
      if (/currentcolor/i.test(color)) return null;   // the canvas reads it as black
      ink = ink || document.createElement('canvas').getContext('2d');
      // A colour the canvas refuses leaves the previous one: two different
      // starting colours then read back differently.
      ink.fillStyle = '#010203'; ink.fillStyle = String(color || '');
      var v = String(ink.fillStyle), m;
      ink.fillStyle = '#040506'; ink.fillStyle = String(color || '');
      if (String(ink.fillStyle) !== v) return null;
      if ((m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(v))) {
        return [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)];
      }
      m = v.match(/[\d.]+/g);
      if (!m || m.length < 3 || (m.length > 3 && +m[3] < 1)) return null;
      return [+m[0], +m[1], +m[2]];
    } catch (e) { return null; }
  }
  // The text colour on the accent that clears 4.5:1: white or the near-black
  // #101214, whichever reads better, and pure black for the mid tones where
  // neither does (black clears 4.6:1 on every one of those).
  function accentFg(rgb) {
    function lin(v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
    function lum(c) { return 0.2126 * lin(c[0]) + 0.7152 * lin(c[1]) + 0.0722 * lin(c[2]); }
    var L = lum(rgb) + 0.05, onWhite = 1.05 / L, onInk = L / (lum([16, 18, 20]) + 0.05);
    if (Math.max(onWhite, onInk) >= 4.5) return onWhite >= onInk ? '#FFFFFF' : '#101214';
    return '#000000';
  }
  function applyAccent() {
    var color = storedAccent(), rgb = color ? rgbOf(color) : null;
    var s = document.documentElement.style;
    if (rgb) {
      s.setProperty('--accent', color);
      s.setProperty('--accent-fg', accentFg(rgb));
    } else {
      s.removeProperty('--accent');
      s.removeProperty('--accent-fg');
    }
    try { window.dispatchEvent(new CustomEvent('cd-accent', { detail: { accent: rgb ? color : '' } })); } catch (e) {}
  }
  function put(body) {
    return fetch('/api/settings', { method: 'PUT', headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify(body) });
  }
  // A choice made here is not undone by a hub reply that was already on its
  // way: `epoch` moves with every choice (here or in another tab) and every
  // finished save, and sync() takes the hub's accent only when it did not move
  // while the reply was out and every choice has been saved.
  var epoch = 0, chosen = 0, saved = 0, saving = false, queued = null;
  function chooseAccent(color) {
    try { if (color) localStorage.setItem('cd-accent', color); else localStorage.removeItem('cd-accent'); } catch (e) {}
    epoch++; chosen++;
    applyAccent();
  }
  // Saves reach the hub one at a time and only the newest waiting one is sent,
  // so the hub ends on the last choice. Resolves with the hub's settings, or
  // with null when a newer save took this one's place.
  function saveAccent(color) {
    return new Promise(function (resolve, reject) {
      if (queued) queued.resolve(null);
      queued = { want: color || 'default', chosen: chosen, resolve: resolve, reject: reject };
      pump();
    });
  }
  function pump() {
    if (saving || !queued) return;
    var job = queued;
    queued = null; saving = true;
    put({ accent: job.want }).then(function (r) {
      return r.json().catch(function () { return null; }).then(function (b) {
        if (!r.ok) throw new Error(r.status + ' ' + (b ? JSON.stringify(b) : ''));
        return b;
      });
    }).then(job.resolve, job.reject).then(function () {
      saving = false; saved = Math.max(saved, job.chosen); epoch++;
      pump();
    });
  }
  // Adopt the hub's choices, which another device may have changed. If the hub
  // has none yet, hand it this browser's so a choice made before is kept.
  function sync() {
    var at = epoch;
    fetch('/api/settings', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (s) {
        if (!s) return;
        // The hub's word for a board (static/noun.js): kept for the next load,
        // and the page told when it is not the word it painted with.
        if (s.projectNoun && window.setNoun && window.setNoun(s.projectNoun)) {
          try { window.dispatchEvent(new CustomEvent('cd-noun')); } catch (e) {}
        }
        if (typeof s.theme === 'string') {
          var local = stored();
          if (s.theme && s.theme !== local) {
            try { localStorage.setItem('cd-theme', s.theme); } catch (e) {}
            apply();
          } else if (!s.theme && local !== 'light') {
            put({ theme: local }).catch(function () {});
          }
        }
        // A hub from before the accent was synced sends none: leave it be.
        var settled = at === epoch && !saving && !queued && saved === chosen;
        if (typeof s.accent === 'string' && settled) {
          var mine = storedAccent(), want = s.accent === 'default' ? '' : s.accent;
          if (s.accent && want !== mine) {
            try {
              if (want) localStorage.setItem('cd-accent', want); else localStorage.removeItem('cd-accent');
            } catch (e) {}
            applyAccent();
          } else if (!s.accent && mine && rgbOf(mine)) {
            saveAccent(mine).catch(function () {});
          }
        }
      }).catch(function () {});
  }
  window.cdTheme = { apply: apply, sync: sync, stored: stored, scheme: SCHEME, themes: Object.keys(SCHEME),
                     applyAccent: applyAccent, storedAccent: storedAccent, rgbOf: rgbOf, put: put,
                     chooseAccent: chooseAccent, saveAccent: saveAccent };
  apply();
  applyAccent();
  if (mq && mq.addEventListener) mq.addEventListener('change', apply);
  window.addEventListener('storage', function (ev) {
    if (ev.key === 'cd-theme') apply();
    if (ev.key === 'cd-accent') { epoch++; applyAccent(); }
  });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) sync(); });
  sync();
})();
</script>

  /* ---- Layout A (#126): the mockup's conversation, with a mouse only -------

// --- chat-window theming -------------------------------------------------

// ---- Folding a long conversation -----------------------------------------
// ---- Numbered points: begin ------------------------------------------------
// A message of numbered items, one point each (points.py, message_refs.py):
// "## Points (N)" from the editor below, "## Review comments (N)" from the
// comment tray; one "**N.**" item each, outside code fences. Read as
// { title, head, items } (the head without its title line), or null.
// tests/test_session_editor.py runs this block in Node.
const ITEMS_HEAD_RE = /^## (?:Review comments|Points) \(\d+\)/;

    const f = lines[i].match(/^\s*(```|~~~)/);
    if (f) { fence = fence === f[1] ? null : (fence || f[1]); continue; }
    if (fence === null && ITEM_START_RE.test(lines[i])) starts.push(i);

  return { title: lines[0].trim(), head: lines.slice(1, starts[0]).join('\n').trim(),

}

// "[point Pn]" lines it ends with.
function itemTail(item) {

  let n = lines.length;
  while (n && (!lines[n - 1].trim() || ITEM_TAIL_RE.test(lines[n - 1]))) n--;

  return [lines.slice(0, n).join('\n').replace(/\s+$/, ''), lines.slice(n).join('\n').trim()];

// ---- Numbered points: end --------------------------------------------------
// The latest exchange is drawn in full: at least the last FOLD_MIN balloons,
// and back to the person's own last message when that is within FOLD_MAX.
// Everything older is one row each (who, first line), opened in place by a
// click. A rotation line is a landmark and always shows. What is quiet (hub
// traffic, see below) is a row at any age and counts for none of this.
const FOLD_MIN = 10, FOLD_MAX = 25;

const isHubRow = m => !!m && m.kind === 'notice' && m.noticeKind === 'restart';

    seen++;
    if (seen <= FOLD_MIN) { start = i; userSeen = userSeen || m.from === 'user'; continue; }

// every balloon keeps what it was last drawn as, whatever arrives or leaves:
// nothing folds under the reader. What arrives after the known balloons is
// drawn in full, what appears before them folded.
// fold = { base: key → 'full' | 'row' as last drawn, open: keys the reader opened }.
// A balloon holding a comment's passage (held) is opened, and stays open while
// the reader is scrolled up even when the comment goes.
// quiet(m, i): a row whatever its age (hub traffic), unless opened or held. A
// quiet balloon drawn open is 'kept' in base, so it too stays open while the

// input is a row, every agent balloon says what it answers, and "Just us"
// folds the replies to the hub too.
const HUB_KIND_LABEL = { digest: 'Progress check', due: 'Due now', report: 'Report', relay: 'Team message',

  points: 'Your open asks', pomsg: 'From another PO', stalled: 'Stall check', po: 'From the PO',

function tailLines(ptyId, n) {
  let raw = readScreen(ptyId).map(l => l.replace(/\s+$/, ''));

  // box or as a pair of full-width rules, with the mode banner, the tip line and
  // the shortcut hint underneath — none of which says what the agent is doing.
  for (let i = Math.max(0, raw.length - 10); i < raw.length; i++) {
    const t = raw[i].trim();

// ---- Page update: begin shared block ----------------------------------------
// The hub serves the pages from disk, so a merge is live on the next load; this
// keeps a tab that stays open on the current page. At load the page knows the
// stamps it was served with (<meta name="ensemble-pages">, written by the hub
// as it serves the page); /api/config says what is on disk now. The page's own
// poll asks every 30 s, and when this page's file or a hub script it loads has
// changed, the page reloads where it was — unless the person is in the middle
// of something: text they typed that is still there, a comment composer, a
// selection, an open dialog, a drag or a held pointer, or any input in the last
// few seconds. Then one line at the top says "Ensemble was updated · Reload",
// and the page reloads on a click, by itself once idle (nothing in hand and no
// input for 60 s), or when the tab is hidden and holds no text. A page framed
// in another (the chat in the task panel) leaves the reload to its host when
// the host is about to reload too, and a host reloads only when its frames are
// idle as well, saving their places with its own. A hub restart from the Update button holds this off (hold) so
// the two never reload twice. Each page adds what only it knows: ensUpdBusy()
// (what counts as in hand there), ensUpdPlace() (what to put back, or a url to

  } catch (e) {}

  // (A module a page imports is listed as a <link rel="modulepreload"> for this.)

  const S = { page: PAGE, loaded, pages: null, pending: false, hold: false, reloading: false, lastInput: Date.now(), checkedAt: Date.now(), checking: false, line: null, timer: 0 };
  const typed = new Set();      // the fields typed in since the page loaded

  // and so does a field in a dialog (a task's title is taken by Start, not by

  // chat in the task panel comes back where it was when the panel opens again.

let UPD_PLACE = ensUpd.restore();

// The poll also asks, every 30 s, whether the page on disk is still this one.
// Embedded in the dashboard (#150): a chat off screen (the page's tab in the

// own classes on the frame's ancestors, same origin) polls the room every
// 30 s as a keep-alive; a chat panel of its own that is not being typed in
