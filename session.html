<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>session</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
<style>
  :root { --bg:#0e0e0e; --surface:#161616; --fg:#ededed; --border:#2a2a2a; --accent:#c25d3c; --dim:#9a9a9a; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--fg); font:13px system-ui,-apple-system,sans-serif; }
  header { display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--border); flex:0 0 auto; }
  header h1 { font-size:14px; margin:0; }
  .grow { flex:1; }
  .status { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:2px 8px; border-radius:10px; border:1px solid transparent; }
  .status.active { color:#16a34a; background:#16a34a22; border-color:#16a34a55; }
  .status.waiting_human { color:#eab308; background:#eab30822; border-color:#eab30855; }
  .status.paused { color:#ef4444; background:#ef444422; border-color:#ef444455; }
  .dim { color:var(--dim); font-size:11px; }
  main { flex:1; display:flex; min-height:0; }
  #chatcol { flex:1; display:flex; flex-direction:column; min-width:0; border-right:1px solid var(--border); }
  #msgs { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px; }
  .msg { border:1px solid var(--border); border-radius:10px; padding:8px 10px; max-width:92%; background:#ffffff08; }
  .msg .from { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; opacity:.85; margin-bottom:3px; }
  .msg.claude { border-color:#d9775755; } .msg.claude .from { color:#d97757; }
  .msg.codex { border-color:#10a37f55; } .msg.codex .from { color:#10a37f; }
  .msg.user { align-self:flex-end; border-color:var(--accent); background:#c25d3c1a; }
  .msg .text { white-space:pre-wrap; word-break:break-word; line-height:1.45; }
  .to { font-weight:400; opacity:.6; text-transform:none; }
  #compose { border-top:1px solid var(--border); padding:10px; display:flex; flex-direction:column; gap:6px; flex:0 0 auto; }
  #compose textarea { width:100%; min-height:48px; resize:vertical; background:var(--surface); color:var(--fg); border:1px solid var(--border); border-radius:6px; padding:6px; font:inherit; }
  #agentcol { flex:0 0 46%; display:flex; flex-direction:column; min-width:0; overflow-y:auto; }
  .agent { border-bottom:1px solid var(--border); }
  .agent .ah { display:flex; align-items:center; gap:8px; padding:8px 10px; cursor:pointer; user-select:none; }
  .agent .ah:hover { background:#ffffff08; }
  .agent .ah .nm { font-weight:700; }
  .adot { font-size:10px; color:#6b7280; }
  .adot.working { color:#16a34a; } .adot.idle { color:#6b7280; } .adot.dead { color:#ef4444; }
  .astat { font-size:11px; }
  .agent .term { height:300px; display:none; background:#0b0b0b; padding:4px; }
  .agent.open .term { display:block; }
  /* Solo session: one agent, driven directly — hide the chat, terminal fills. */
  body.solo #chatcol { display:none; }
  body.solo #agentcol { flex:1; }
  body.solo .agent { border-bottom:none; height:100%; display:flex; flex-direction:column; }
  body.solo .agent .ah { cursor:default; }
  body.solo .agent .ah .toggle { display:none; }
  body.solo .agent .term { display:block; flex:1; height:auto; }
  button { background:#2a2a2a; color:var(--fg); border:1px solid #444; padding:4px 12px; border-radius:6px; cursor:pointer; font:inherit; }
  button:hover { background:#333; }
</style>
</head>
<body>
<header>
  <h1 id="title">session</h1>
  <span id="status" class="status"></span>
  <span id="hop" class="dim"></span>
  <span class="grow"></span>
  <button id="dock" hidden title="Dock this session back into the dashboard panel">⧉ Dock</button>
  <button id="resume" hidden title="Relaunch the agent(s) with their conversation">↻ Resume</button>
  <button id="pause">Pause</button>
  <button id="end" title="Stop the agent(s) and end this session">End</button>
</header>
<main>
  <div id="chatcol">
    <div id="msgs"></div>
    <div id="compose">
      <div class="dim" id="hint"></div>
      <textarea id="input" placeholder="Message the agents — Ctrl+Enter to send. Start with @codex or @claude to direct it to one."></textarea>
      <div style="display:flex; gap:8px; align-items:center">
        <span class="dim">To</span>
        <select id="to"><option value="">Everyone</option></select>
        <button id="send">Send</button>
      </div>
    </div>
  </div>
  <div id="agentcol"></div>
</main>
<script>
const qs = new URLSearchParams(location.search);
const ROOM = qs.get('id');
const $ = s => document.querySelector(s);
const esc = s => (s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const jpost = (path, body) => fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) }).then(r=>r.json());
const b64bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
// Strip terminal query REPLIES (fg/bg color = OSC 10/11, device attributes =
// CSI ? … c) that some PTY/ConPTY setups leak into the output as literal text.
function cleanSeq(s) {
  return s
    .replace(/\x1b?\]1[01];rgb:[0-9a-f\/]+(?:\x1b\\|\x07|\\)/gi, '')
    .replace(/\x1b?\[\?[0-9;]+c/g, '');
}

const terms = {};          // ptyId -> {term, es}
let agentsBuilt = false;

function buildAgents(room) {
  const col = $('#agentcol'); col.innerHTML = '';
  room.participants.filter(p => p.kind === 'agent').forEach(p => {
    const div = document.createElement('div');
    div.className = 'agent';
    div.innerHTML = `<div class="ah"><span class="adot" data-pty="${esc(p.ptyId||'')}">●</span> `
      + `<span class="nm">${esc(p.identity)}</span>`
      + `<span class="dim">${esc(p.agent)}${p.model ? ' · ' + esc(p.model) : ''}</span>`
      + `<span class="astat dim" data-pty="${esc(p.ptyId||'')}"></span>`
      + `<span class="grow"></span><span class="dim toggle">▸ terminal</span></div>`
      + `<div class="term"></div>`;
    div.querySelector('.ah').onclick = () => toggleTerm(div, p.ptyId);
    col.appendChild(div);
  });
  // Populate the "To" picker: Everyone + each agent (directed message).
  const sel = $('#to');
  const keep = sel.value;
  sel.innerHTML = '<option value="">Everyone</option>' +
    room.participants.filter(p => p.kind === 'agent')
      .map(p => `<option value="${esc(p.identity)}">${esc(p.identity)}</option>`).join('');
  sel.value = keep;
  // Solo session: auto-open the single agent's terminal (it's the main view).
  const agentDivs = col.querySelectorAll('.agent');
  if (agentDivs.length === 1) {
    const div = agentDivs[0];
    const p = room.participants.find(x => x.kind === 'agent');
    div.classList.add('open');
    const tog = div.querySelector('.toggle'); if (tog) tog.textContent = '▾ terminal';
    if (p && p.ptyId && !terms[p.ptyId]) mountTerm(div.querySelector('.term'), p.ptyId);
  }
  agentsBuilt = true;
}
function toggleTerm(div, ptyId) {
  const open = div.classList.toggle('open');
  div.querySelector('.toggle').textContent = open ? '▾ terminal' : '▸ terminal';
  if (open && ptyId && !terms[ptyId]) mountTerm(div.querySelector('.term'), ptyId);
  else if (open && terms[ptyId]) syncSize(ptyId);
}
// Match the PTY's size to the rendered xterm, else the agent's absolute cursor
// positioning lands wrong and the layout looks garbled.
function syncSize(ptyId) {
  const t = terms[ptyId]; if (!t) return;
  try { t.fit && t.fit.fit(); } catch(e) {}
  jpost('/api/pty/resize', { id: ptyId, rows: t.term.rows, cols: t.term.cols });
}
function mountTerm(el, ptyId) {
  const term = new Terminal({
    fontSize: 13, convertEol: false, scrollback: 8000, cursorBlink: true,
    fontFamily: 'Consolas, "Cascadia Mono", "DejaVu Sans Mono", monospace',
    theme: { background: '#0b0b0b' },
  });
  let fit = null;
  try { fit = new FitAddon.FitAddon(); term.loadAddon(fit); } catch(e) {}
  term.open(el);
  // Copy (Ctrl+Shift+C) / paste (Ctrl+Shift+V or right-click). The app itself
  // uses plain Ctrl+C/V, so the shift variants are the terminal's — like a real
  // terminal.
  term.attachCustomKeyEventHandler((e) => {
    if (e.type !== 'keydown' || !(e.ctrlKey && e.shiftKey)) return true;
    if (e.code === 'KeyC') {
      const sel = term.getSelection();
      if (sel) { navigator.clipboard.writeText(sel).catch(() => {}); return false; }
    }
    if (e.code === 'KeyV') {
      navigator.clipboard.readText().then(t => term.paste(t)).catch(() => {});
      return false;
    }
    return true;
  });
  el.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    navigator.clipboard.readText().then(t => term.paste(t)).catch(() => {});
  });
  const td = new TextDecoder();
  const es = new EventSource('/api/pty/stream?id=' + encodeURIComponent(ptyId));
  es.onmessage = ev => term.write(cleanSeq(td.decode(b64bytes(ev.data), { stream: true })));
  term.onData(d => jpost('/api/pty/input', { id: ptyId, data: d }));
  terms[ptyId] = { term, es, fit };
  // Size the PTY to the terminal once it has laid out; focus it for typing.
  setTimeout(() => { syncSize(ptyId); term.focus(); }, 60);
  try { new ResizeObserver(() => syncSize(ptyId)).observe(el); } catch(e) {}
}

function renderMsgs(room) {
  const box = $('#msgs');
  const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 50;
  box.innerHTML = room.messages.map(m => {
    const cls = m.from === 'user' ? 'user' : esc(m.from);
    const to = m.to && m.to !== 'all' ? ` <span class="to">→ ${esc(m.to)}</span>` : '';
    return `<div class="msg ${cls}"><div class="from">${esc(m.from)}${to}</div><div class="text">${esc(m.text)}</div></div>`;
  }).join('');
  if (atBottom) box.scrollTop = box.scrollHeight;
}

async function refresh() {
  let room;
  try { room = await fetch('/api/room?id=' + encodeURIComponent(ROOM)).then(r => r.json()); }
  catch(e) { return; }
  if (!room || room.error) { $('#title').textContent = '(session not found)'; return; }
  document.title = room.title + ' — session';
  $('#title').textContent = room.title;
  const st = room.status || '';
  const sb = $('#status'); sb.className = 'status ' + st; sb.textContent = st.replace('_', ' ');
  $('#hop').textContent = `hop ${room.hopCount || 0}/${room.maxHops || 0}`;
  const ended = st === 'ended' || room.live === false;
  $('#hint').textContent = ended
    ? 'This collaboration has ended — the agents have stopped. The transcript is preserved.'
    : (st === 'waiting_human' || st === 'paused')
      ? 'The agents are waiting for you — reply to resume.' : '';
  $('#send').disabled = ended;
  $('#input').disabled = ended;
  $('#resume').hidden = !ended;
  const pb = $('#pause');
  pb.style.display = ended ? 'none' : '';
  pb.textContent = st === 'paused' ? 'Resume' : 'Pause';
  pb.onclick = () => jpost('/api/room/status', { roomId: ROOM, status: st === 'paused' ? 'active' : 'paused' }).then(refresh);
  const soloMode = room.mode === 'solo' ||
    room.participants.filter(p => p.kind === 'agent').length === 1;
  document.body.classList.toggle('solo', soloMode);
  if (!agentsBuilt && room.participants.some(p => p.kind === 'agent' && p.ptyId)) buildAgents(room);
  if (!soloMode) renderMsgs(room);
  updateAgentStatus();
}

// Live per-agent status dot: working (recent output) / idle / stopped.
async function updateAgentStatus() {
  let ptys = [];
  try { ptys = await fetch('/api/ptys').then(r => r.json()); } catch(e) { return; }
  const map = {};
  ptys.forEach(x => map[x.id] = x);
  document.querySelectorAll('.adot').forEach(dot => {
    const info = map[dot.dataset.pty];
    let cls = 'dead', txt = 'stopped';
    if (info && info.alive) {
      if (info.idleSeconds < 2.5) { cls = 'working'; txt = 'working…'; }
      else { cls = 'idle'; txt = 'idle'; }
    }
    dot.className = 'adot ' + cls;
    const stat = document.querySelector('.astat[data-pty="' + dot.dataset.pty + '"]');
    if (stat) stat.textContent = txt;
  });
}
$('#send').onclick = async () => {
  const t = $('#input').value.trim(); if (!t) return;
  let to = $('#to') ? $('#to').value : '';
  // A leading @<identity> overrides the To picker: "@codex do X" → codex only.
  const m = t.match(/^@([\w-]+)\b/);
  if (m) {
    const idents = $('#to') ? [...$('#to').options].map(o => o.value) : [];
    if (idents.includes(m[1]) || m[1] === 'user') to = m[1];
  }
  await jpost('/api/room/say', { roomId: ROOM, text: t, to });
  $('#input').value = ''; if ($('#to')) $('#to').value = ''; refresh();
};
$('#input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $('#send').click(); }
});
$('#end').onclick = async () => {
  if (!confirm('End this session and stop the agent(s)?')) return;
  try { await jpost('/api/room/close', { roomId: ROOM }); } catch(e) {}
  window.close();
};
$('#resume').onclick = async () => {
  $('#resume').disabled = true;
  try {
    await jpost('/api/room/resume', { roomId: ROOM });
    // ptyIds changed → tear down the dead terminals and rebuild.
    Object.values(terms).forEach(t => { try { t.es.close(); } catch(e) {} });
    for (const k in terms) delete terms[k];
    agentsBuilt = false;
    await refresh();
  } catch (e) { /* stay ended */ }
  $('#resume').disabled = false;
};
// In a solo session the terminal is the main surface — refocus it when the
// window regains focus so you can just start typing.
window.addEventListener('focus', () => {
  if (!document.body.classList.contains('solo')) return;
  const t = Object.values(terms)[0];
  if (t) { try { t.term.focus(); } catch (e) {} }
});
// Floating window (opened by the dashboard) → offer "Dock" to move it back into
// the panel. When embedded as the panel's iframe, this is hidden (the panel has
// its own "Pop out").
const inIframe = window.parent !== window;
if (!inIframe && window.opener) {
  const dockBtn = $('#dock');
  dockBtn.hidden = false;
  dockBtn.onclick = () => {
    try { window.opener.postMessage({ type: 'dock-session', roomId: ROOM }, '*'); } catch (e) {}
    window.close();
  };
}
if (!ROOM) { $('#title').textContent = '(no session id)'; }
else { refresh(); setInterval(refresh, 2000); }
</script>
</body>
</html>
