<script>
// Appearance, resolved before first paint so the page never flashes the wrong
// theme. A theme is a complete token set under :root[data-theme="<name>"].
// Light is the default whatever the OS says; "system" follows the OS between
// Light and Dark. The choice follows the person, not the browser: it lives on
// the hub (settings.theme), and localStorage['cd-theme'] is only its
// first-paint cache. index.html, session.html and fileview.html carry the same
// script; change all three together.
(function () {
  var SCHEME = { light: 'light', dark: 'dark', dim: 'dark', paper: 'light', contrast: 'light', fjord: 'dark' };
  var mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
  function stored() {
    try { return localStorage.getItem('cd-theme') || 'light'; } catch (e) { return 'light'; }
  }
  function apply() {
    var pref = stored();
    var name = pref === 'system' ? (mq && mq.matches ? 'dark' : 'light') : (SCHEME[pref] ? pref : 'light');
    var root = document.documentElement;
    root.dataset.theme = name;
    root.dataset.scheme = SCHEME[name];
    try { window.dispatchEvent(new CustomEvent('cd-theme', { detail: { pref: pref, theme: name } })); } catch (e) {}
  }
  // Adopt the hub's choice, which another device may have changed. If the hub
  // has none yet, hand it this browser's so a choice made before is kept.
  function sync() {
    fetch('/api/settings', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (s) {
        if (!s || typeof s.theme !== 'string') return;
        var local = stored();
        if (s.theme && s.theme !== local) {
          try { localStorage.setItem('cd-theme', s.theme); } catch (e) {}
          apply();
        } else if (!s.theme && local !== 'light') {
          fetch('/api/settings', { method: 'PUT', headers: { 'Content-Type': 'application/json' },
                                   body: JSON.stringify({ theme: local }) }).catch(function () {});
        }
      }).catch(function () {});
  }
  window.cdTheme = { apply: apply, sync: sync, stored: stored, scheme: SCHEME };
  apply();
  if (mq && mq.addEventListener) mq.addEventListener('change', apply);
  window.addEventListener('storage', function (ev) { if (ev.key === 'cd-theme') apply(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) sync(); });
  sync();
})();
</script>

  * { box-sizing: border-box; }
  /* --vv-h is the visible viewport on a touch screen (set by script), so the
     composer at the foot of the page stays above the on-screen keyboard. */
  body { margin:0; height:100vh; height:var(--vv-h, 100dvh); display:flex; flex-direction:column; background:var(--bg); color:var(--fg); font:13px system-ui,-apple-system,sans-serif; }
  header { display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--border); flex:0 0 auto; }
  header h1 { font-size:14px; margin:0; }
  .grow { flex:1; }
  .status { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:2px 8px; border-radius:10px; border:1px solid transparent; }
  .status.active { color:var(--c-success-fg); background:var(--c-success-bg); border-color:transparent; }
  .status.waiting_human { color:var(--c-warning-fg); background:var(--c-warning-bg); border-color:transparent; }
  .status.paused { color:var(--c-neutral-fg); background:var(--c-neutral-bg); border-color:transparent; }
  .dim { color:var(--dim); font-size:11px; }
  #info { flex:0 0 auto; display:flex; gap:12px; align-items:center; flex-wrap:wrap;
    padding:5px 12px; border-bottom:1px solid var(--border); font-size:11px; color:var(--dim); }
  #info .ib-agent { color:var(--fg); }
  #info .ib-agent.claude { color:var(--agent-claude-bg); } #info .ib-agent.codex { color:var(--agent-codex-bg); }
  main { flex:1; display:flex; min-height:0; }
  #chatcol { flex:1; display:flex; flex-direction:column; min-width:0; border-right:1px solid var(--border); }
  #msgs { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px; }
  .msg.pending { opacity:.72; }   /* sent, not yet in the transcript */
  .msg { border:1px solid var(--border); border-radius:var(--r-300); padding:8px 10px; max-width:92%; background:var(--surface); }
  .msg .from { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; opacity:.85; margin-bottom:3px; }
  .msg.claude { border-color:color-mix(in srgb, var(--agent-claude-bg) 45%, transparent); } .msg.claude .from { color:var(--agent-claude-bg); }
  .msg.codex { border-color:color-mix(in srgb, var(--agent-codex-bg) 45%, transparent); } .msg.codex .from { color:var(--agent-codex-bg); }
  /* Your messages read left-aligned like everyone else's — right-aligning them
     wasted the width of the column. The accent edge is what marks them. */
  .msg.user { border-left:3px solid var(--border-strong); border-color:var(--border); background:var(--hover); }
  /* A PO rotation: where one session ends and a fresh one starts. */
  .rot-line { display:flex; align-items:center; gap:var(--s-200); color:var(--fg-muted);
    font-size:var(--fs-200); line-height:16px; }
  .rot-line::before, .rot-line::after { content:''; flex:1 1 24px; border-top:1px solid var(--border-strong); }
  .rot-line span { flex:0 1 auto; max-width:80%; text-align:center; }
  .msg .text { white-space:pre-wrap; word-break:break-word; line-height:1.45; }
  /* Markdown-rendered bubble content (see mdToHtml). */
  .msg .text.md { white-space:normal; line-height:1.5; }
  .msg .text.md .ln { white-space:pre-wrap; word-break:break-word; margin:0 0 1px; }
  .msg .text.md ul, .msg .text.md ol { margin:4px 0; padding-left:20px; }
  .msg .text.md li { margin:1px 0; }
  .msg .text.md h3 { font-size:15px; font-weight:700; margin:13px 0 6px; padding-bottom:3px; border-bottom:1px solid var(--border); }
  .msg .text.md h4 { font-size:13px; font-weight:700; margin:11px 0 4px; }
  .msg .text.md h5, .msg .text.md h6 { font-size:12px; font-weight:700; margin:9px 0 3px; }
  .msg .text.md > :first-child { margin-top:0; }
  .msg .text.md .ln-gap { height:.6em; }

  .cmt-composer { position:fixed; z-index:61; top:50%; left:50%; transform:translate(-50%,-50%); width:min(440px,92vw); background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:0 14px 44px rgba(0,0,0,.55); padding:14px; }

  #promptcard .pc-head { font-size:12px; font-weight:700; color:var(--c-warning-fg); margin-bottom:6px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  #promptcard .pc-x { background:transparent; border:none; color:var(--dim); font-size:15px; line-height:1; cursor:pointer; padding:2px 4px; border-radius:5px; }

  #compose textarea { width:100%; min-height:48px; resize:vertical; background:var(--surface); color:var(--fg); border:1px solid var(--border); border-radius:6px; padding:6px; font:inherit; }
  #agentcol { flex:0 0 46%; display:flex; flex-direction:column; min-width:0; overflow-y:auto; }

  .agent .ah:hover { background:var(--hover); }
  .agent .ah .nm { font-weight:700; }
  .adot { font-size:10px; color:var(--run-idle); }
  .adot.working { color:var(--run-working); } .adot.idle { color:var(--run-idle); } .adot.dead { color:var(--c-danger-bold); }

  .agent.open .term { display:block; }
  /* Solo session: one agent. It now uses the same balloon chat as a room (its
     live transcript), with the raw terminal available via the Terminals toggle. */
  body.solo .agent { border-bottom:none; height:100%; display:flex; flex-direction:column; }
  body.solo .agent .ah { cursor:default; }
  body.solo .agent .ah .toggle { display:none; }
  body.solo .agent .term { display:block; flex:1; height:auto; }
  button { background:var(--surface); color:var(--fg); border:1px solid var(--border-strong); padding:4px 12px; border-radius:var(--r-200); cursor:pointer; font:inherit; }

  body.embed > header, body.embed > #info { display:none; }
  /* The raw per-agent terminals duplicate the chat and eat width (badly on

  body.term-hidden #chatcol { border-right:none; }

  #theme-menu-s .tm-item { padding:6px 12px; border-radius:5px; cursor:pointer; font-size:12px; white-space:nowrap; }
  #theme-menu-s .tm-item:hover { background:var(--hover); color:var(--fg); }

  #theme-menu-s .tm-rule { height:1px; background:var(--border); margin:var(--s-100) 0; }
  /* ---- Phone (SKILL.md §8) ---------------------------------------------
     Keyed on a touch screen, not on width: on a desktop this page sits in the
     dashboard's task panel and the PO's drawer, both narrower than a phone
     breakpoint, and a width query would restyle them there. */
  @media (pointer: coarse) {
    /* The window's own header (hidden when embedded) holds a dozen buttons:
       in one row they ran 264px past the edge of a 360px phone, and wrapped
       they took three rows and pushed Send under the keyboard. One row that
       scrolls sideways keeps every button reachable and the chat its height. */
    header { overflow-x: auto; scrollbar-width: none; }

    header > * { flex: 0 0 auto; }
    header h1 { flex: 0 1 auto; max-width: 60vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    header .grow { display: none; }
    /* While you type, the header and info bar step aside: a landscape phone
       with its keyboard up leaves about 200px, and Send ended 1px under the

    body:has(#input:focus) > header, body:has(#input:focus) > #info { display: none; }

    textarea, select, input, #compose textarea, .cmt-composer textarea { font-size: var(--fs-400); }
    .status, .msg .from, #livetail .lt-head, #livetail .lt-more,
    .msg .text.md pre.cb[data-lang]::before, .adot { font-size: var(--fs-100); }

<body>
<header>
  <h1 id="title">session</h1>
  <span id="status" class="status"></span>
  <span id="hop" class="dim"></span>
  <span class="grow"></span>
  <button id="dock" hidden title="Dock this session back into the dashboard panel">⧉ Dock</button>
  <button id="resume" hidden title="Relaunch the agent(s) with their conversation">↻ Resume</button>
  <button id="terms" hidden title="Show/hide the raw per-agent terminals">🖥 Terminals</button>
  <button id="pause">Pause</button>
  <button id="pin" hidden title="Pin this session for quick access">📌 Pin</button>
  <button id="rename" hidden title="Rename this session">✎ Rename</button>
  <button id="autolabel" hidden title="Ask Claude to suggest a label from the conversation">✨ Auto</button>
  <button id="explorer" hidden title="Open the working folder on the host">📂 Files</button>
  <button id="ide" hidden title="Open the project in its editor (on the host)">🧠 IDE</button>
  <button id="theme" hidden title="The chat follows the dashboard theme; switch this task's chat to its folder's terminal colours instead">🎨 Chat colours</button>
  <button id="end" title="Stop the agent(s) and end this session">End</button>
</header>
<div id="info"></div>
<main>
  <div id="chatcol">
    <div id="msgs"></div>
    <div id="promptcard" hidden></div>
    <div id="livetail" hidden></div>
    <div id="activity" hidden></div>
    <div id="compose">
      <div class="dim" id="hint"></div>
      <textarea id="input" placeholder="Message the agents — Ctrl+Enter to send. Start with @codex or @claude to direct it to one."></textarea>
      <div style="display:flex; gap:8px; align-items:center">
        <span class="dim">To</span>
        <select id="to"><option value="">Everyone</option></select>
        <button id="send">Send</button>
      </div>
    </div>
  </div>
  <div id="agentcol"></div>
</main>
<div id="tailpop" hidden></div>
<script>
const qs = new URLSearchParams(location.search);
const ROOM = qs.get('id');
let OPERATOR = 'you';   // how the human ("user") is shown — nickname / git name
fetch('/api/settings').then(r => r.json()).then(s => { OPERATOR = s.operatorName || s.operatorNickname || 'you'; }).catch(() => {});
const identLabel = id => `<span class="mention">@${esc(id === 'user' ? OPERATOR : id)}</span>`;
if (qs.get('embed')) document.body.classList.add('embed');
// ?agent=<identity> — arrived from a notification about that specific agent, so
// land on its terminal rather than on a page with the terminals switched off.
const FOCUS_AGENT = (qs.get('agent') || '').trim();
if (!FOCUS_AGENT) document.body.classList.add('term-hidden');   // terminals off by default
// The on-screen keyboard. Android shrinks the page when it opens (the viewport
// tag asks for that); iOS shrinks only the visual viewport and scrolls it. The
// page is kept exactly as tall as what is visible, and back at the top, so the
// composer at its foot is never under the keyboard. Touch screens only.
const TOUCH = window.matchMedia('(pointer: coarse)').matches;
if (TOUCH && window.visualViewport) {
  // Set only while the visible viewport is shorter than the page (the iOS
  // keyboard); otherwise 100dvh, so a stale reading can never shorten the page.
  const fitVisualViewport = () => {
    const root = document.documentElement.style;
    if (visualViewport.height < window.innerHeight - 1) root.setProperty('--vv-h', Math.round(visualViewport.height) + 'px');
    else root.removeProperty('--vv-h');
    if (visualViewport.offsetTop > 0) window.scrollTo(0, 0);
  };
  visualViewport.addEventListener('resize', fitVisualViewport);
  fitVisualViewport();
}
const $ = s => document.querySelector(s);
const esc = s => (s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Minimal, self-contained markdown → HTML for chat bubbles. Escape-first so it's
// XSS-safe: fenced/inline code is pulled out to placeholders, the rest is escaped,
// then inline spans + block structure are applied, then code is restored (escaped).
// A local file path (drive-letter, UNC, ~, or absolute) ending in an extension.
// File links: absolute paths always; relative ones ("docs/plan.md", "NOTES.md")
// are resolved against the task folder, so agents needn't spell out full paths.
const ABS_PATH_RE = /^(?:[A-Za-z]:[\\\/]|\\\\|~\/|\/)/;   // C:\dir, C:/dir, \\unc, ~/x, /x
// mdToHtml escapes before linkifying, so a path arrives with entities in it.
const unescPath = s => (s || '').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
  .replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&');
const REL_PATH_RE = /(^|[\s(*_])((?:\.\.?[\\\/])?(?:[\w.-]+[\\\/])+[\w.-]+\.\w{1,8}|[\w-]+\.(?:md|txt|py|js|ts|tsx|jsx|html|css|json|yaml|yml|toml|csv|pdf|png|jpg|jpeg|gif|svg|sh|ps1|sql|xml|log|ini|cfg))(?=[\s.,;:)\]]|$)/g;
const looksFilePath = s => {
  const t = (s || '').trim();
  if (ABS_PATH_RE.test(t)) return /\S+\.\w{1,8}$/.test(t);
  return /^(?:\.\.?[\\\/])?(?:[\w.-]+[\\\/])+[\w.-]+\.\w{1,8}$/.test(t)
      || /^[\w-]+\.(?:md|txt|py|js|ts|tsx|jsx|html|css|json|yaml|yml|toml|csv|pdf|png|jpg|jpeg|gif|svg|sh|ps1|sql|xml|log|ini|cfg)$/.test(t);
};
function resolvePath(p, base) {
  p = (p || '').trim();
  if (ABS_PATH_RE.test(p) || !base) return p;
  const sep = base.includes('\\') ? '\\' : '/';
  return base.replace(/[\\\/]+$/, '') + sep + p.replace(/^\.[\\\/]/, '').replace(/[\\\/]/g, sep);
}
const fileBase = () => (ROOM_OBJ && ROOM_OBJ.cwd) || '';
const fileHref = p => '/fileview?path=' + encodeURIComponent(unescPath(p).trim()) + (ROOM ? '&room=' + encodeURIComponent(ROOM) : '') + (fileBase() ? '&cwd=' + encodeURIComponent(fileBase()) : '');
function mdToHtml(src) {
  const codes = [];
  let s = (src ?? '').replace(/\r\n/g, '\n');
  // Fenced code blocks ```lang\n...\n```
  s = s.replace(/```([\w+-]*)\n?([\s\S]*?)```/g, (_, lang, body) => {
    const i = codes.push(`<pre class="cb"${lang ? ` data-lang="${esc(lang)}"` : ''}><code>${esc(body.replace(/\n$/, ''))}</code></pre>`) - 1;
    return `␀B${i}␀`;
  });
  // Inline code `...`
  s = s.replace(/`([^`\n]+)`/g, (_, body) => {
    const code = `<code class="ic">${esc(body)}</code>`;
    const i = codes.push(looksFilePath(body) ? `<a href="${fileHref(body.trim())}" target="_blank" rel="noopener">${code}</a>` : code) - 1;
    return `␀I${i}␀`;
  });
  s = esc(s);
  // Inline spans (operate on escaped text; placeholders are safe).
  const inline = t => t
    .replace(/\[([^\]\n]+)\]\(([^)\n]+)\)/g, (m, txt, url) => {
      const t = url.trim();
      if (/^(?:https?:|mailto:|#)/i.test(t)) return `<a href="${t}" target="_blank" rel="noopener">${txt}</a>`;
      return looksFilePath(t) ? `<a href="${fileHref(t)}" target="_blank" rel="noopener" class="file-link">${txt}</a>` : m;
    })
    .replace(/(^|[\s(*_])((?:https?:\/\/)[^\s<)*]+)/g, (_, pre, url) => `${pre}<a href="${url}" target="_blank" rel="noopener">${url}</a>`)
    .replace(/(^|[\s(*_])((?:[A-Za-z]:[\\\/]|\\\\|~\/|\/)[^\s"'<>|?*,;)\]]*\.\w{1,8})/g,
      (_, pre, pth) => `${pre}<a href="${fileHref(pth)}" target="_blank" rel="noopener" class="file-link">${pth}</a>`)
    .replace(REL_PATH_RE, (_, pre, pth) => `${pre}<a href="${fileHref(pth)}" target="_blank" rel="noopener" class="file-link">${pth}</a>`)
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?]|$)/g, '$1<em>$2</em>')
    .replace(/(^|[\s(])_([^_\n]+)_(?=[\s).,!?]|$)/g, '$1<em>$2</em>')
    .replace(/(^|[\s(])@([a-zA-Z][\w-]*)/g, '$1<span class="mention">@$2</span>');
  // Block structure, line by line.
  const lines = s.split('\n');
  const out = [];
  let list = null; // 'ul' | 'ol'
  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  const tableSep = l => /^[\s|:-]+$/.test(l.trim()) && l.includes('|') && l.includes('-');
  const rowCells = l => { let r = l.trim(); if (r.startsWith('|')) r = r.slice(1); if (r.endsWith('|')) r = r.slice(0, -1); return r.split('|').map(c => c.trim()); };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (/^␀B\d+␀$/.test(line.trim())) { closeList(); out.push(line.trim()); continue; }
    let m;
    if (line.includes('|') && i + 1 < lines.length && tableSep(lines[i + 1])) {
      closeList();
      const heads = rowCells(line);
      const aligns = rowCells(lines[i + 1]).map(c => { const L = c.startsWith(':'), R = c.endsWith(':'); return (L && R) ? 'center' : R ? 'right' : L ? 'left' : ''; });
      const body = [];
      let j = i + 2;
      while (j < lines.length && lines[j].includes('|') && lines[j].trim() !== '') { body.push(rowCells(lines[j])); j++; }
      const cell = (c, tag, al) => `<${tag}${al ? ` style="text-align:${al}"` : ''}>${inline(c || '')}</${tag}>`;
      let tbl = '<table><thead><tr>' + heads.map((h, k) => cell(h, 'th', aligns[k])).join('') + '</tr></thead>';
      if (body.length) tbl += '<tbody>' + body.map(row => '<tr>' + heads.map((_, k) => cell(row[k], 'td', aligns[k])).join('') + '</tr>').join('') + '</tbody>';
      out.push(tbl + '</table>');
      i = j - 1;
      continue;
    }
    if ((m = line.match(/^(#{1,4})\s+(.*)$/))) { closeList(); const n = m[1].length + 2; out.push(`<h${n}>${inline(m[2])}</h${n}>`); continue; }
    if (/^\s*([-*_])\1{1,}\s*$/.test(line)) { closeList(); out.push('<hr>'); continue; }
    if ((m = line.match(/^\s*>\s?(.*)$/))) { closeList(); out.push(`<blockquote>${inline(m[1])}</blockquote>`); continue; }
    if ((m = line.match(/^\s*[-*+]\s+(.*)$/))) { if (list !== 'ul') { closeList(); out.push('<ul>'); list = 'ul'; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { if (list !== 'ol') { closeList(); out.push('<ol>'); list = 'ol'; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    if (line.trim() === '') { closeList(); if (out.length && out[out.length - 1] !== '<div class="ln-gap"></div>') out.push('<div class="ln-gap"></div>'); continue; }
    closeList(); out.push(`<div class="ln">${inline(line)}</div>`);
  }
  closeList();
  let html = out.join('\n');
  html = html.replace(/␀([BI])(\d+)␀/g, (_, __, i) => codes[+i]);

}
const tildeify = p => (p || '').replace(/^[A-Za-z]:\\Users\\[^\\]+/i, '~').replace(/^\/(Users|home)\/[^/]+/, '~');

  if (CUR_COLORS) {
    const bg = c.background, fg = c.foreground;
    s.setProperty('--bg', bg);
    s.setProperty('--fg', fg);
    s.setProperty('--surface', `color-mix(in srgb, ${fg} 7%, ${bg})`);

// Which terminal each agent holds. A reviewer on mention gets a new one for

let AGENTS_SIG = '';

}
// A reviewer on mention with no live terminal is not "stopped" — it starts

function buildAgents(room) {
  const col = $('#agentcol'); col.innerHTML = '';
  room.participants.filter(p => p.kind === 'agent').forEach(p => {
    const div = document.createElement('div');
    div.className = 'agent';
    const om = p.onMention ? ' data-onmention="1"' : '';
    div.innerHTML = `<div class="ah"><span class="adot" data-pty="${esc(p.ptyId||'')}"${om}>●</span> `
      + `<span class="nm">${esc(p.identity)}</span>`
      + `<span class="dim">${esc(p.agent)}${p.model ? ' · ' + esc(p.model) : ''}</span>`
      + `<span class="astat dim" data-pty="${esc(p.ptyId||'')}"${om}></span>`
      + `<span class="grow"></span><span class="dim toggle">▸ terminal</span></div>`
      + `<div class="term"></div>`;
    div.querySelector('.ah').onclick = () => toggleTerm(div, p.ptyId);
    col.appendChild(div);
  });
  // Populate the "To" picker: Everyone + each agent (directed message).

    room.participants.filter(p => p.kind === 'agent')
      .map(p => `<option value="${esc(p.identity)}">${esc(p.identity)}</option>`).join('');
  sel.value = keep;
  // Solo session: auto-open the single agent's terminal (it's the main view).
  const agentDivs = col.querySelectorAll('.agent');
  if (agentDivs.length === 1) {
    const div = agentDivs[0];
    const p = room.participants.find(x => x.kind === 'agent');
    div.classList.add('open');
    const tog = div.querySelector('.toggle'); if (tog) tog.textContent = '▾ terminal';
    if (p && p.ptyId && !terms[p.ptyId]) mountTerm(div.querySelector('.term'), p.ptyId);
  }
  // Arrived from a notification about one agent: open that agent's terminal and
  // scroll to it, so the link lands on the evidence instead of near it.
  if (FOCUS_AGENT) {
    const parts = room.participants.filter(p => p.kind === 'agent');
    const idx = parts.findIndex(p => p.identity === FOCUS_AGENT);
    const div = idx >= 0 ? agentDivs[idx] : null;
    if (div) {
      if (!div.classList.contains('open')) toggleTerm(div, parts[idx].ptyId);

function toggleTerm(div, ptyId) {

// Match the PTY's size to the rendered xterm, else the agent's absolute cursor

function syncSize(ptyId) {
  const t = terms[ptyId]; if (!t) return;
  try { t.fit && t.fit.fit(); } catch(e) {}
  jpost('/api/pty/resize', { id: ptyId, rows: t.term.rows, cols: t.term.cols });
}
let _mountQuiet = false;   // mounting to read the screen, not to type in it
function mountTerm(el, ptyId) {
  const quiet = _mountQuiet;

    fontSize: 13, convertEol: false, scrollback: 8000, cursorBlink: true,
    fontFamily: 'Consolas, "Cascadia Mono", "DejaVu Sans Mono", monospace',
    theme: xtermThemeFrom(CUR_COLORS),

  let fit = null;
  try { fit = new FitAddon.FitAddon(); term.loadAddon(fit); } catch(e) {}
  term.open(el);
  // Copy (Ctrl+Shift+C) / paste (Ctrl+Shift+V or right-click). The app itself
  // uses plain Ctrl+C/V, so the shift variants are the terminal's — like a real
  // terminal.
  term.attachCustomKeyEventHandler((e) => {
    if (e.type !== 'keydown' || !(e.ctrlKey && e.shiftKey)) return true;

function renderBubbles(items) {
  const box = $('#msgs');
  // Don't blow away the DOM while the user is mid-comment (it would drop their
  // selection / the open composer). Highlights are re-applied after each render.
  if (_cmtComposerOpen || _selBtn) return;
  const _liveSel = window.getSelection();
  if (_liveSel && !_liveSel.isCollapsed && _liveSel.rangeCount &&
      box.contains(_liveSel.getRangeAt(0).commonAncestorContainer)) return;
  const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 50;
  items = withTaskBubble(items, ROOM_OBJ && ROOM_OBJ.spec, 'from');
  box.innerHTML = items.map(m => {
    if (m.divider || (m.kind === 'notice' && m.rotation)) {
      return `<div class="rot-line" role="separator" data-mid="${esc(m.id || '')}"><span>${esc(rotationText(m.rotation || m.divider))}</span></div>`;
    }
    const cls = m.from === 'user' ? 'user' : esc(m.from);
    const to = m.to && m.to !== 'all' ? ` <span class="to">→ ${identLabel(m.to)}</span>` : '';
    return `<div class="msg ${cls}" data-mid="${esc(m.id || '')}" data-from="${esc(m.from || '')}"><div class="from">${identLabel(m.from)}${to}</div><div class="text md">${mdToHtml(m.text)}</div></div>`;
  }).join('');
  // Messages you just sent that the transcript hasn't recorded yet (a long
  // agent turn delays the flush): keep showing them until they appear for real.
  // Some never will — a "/command", or a digit answering a prompt — so an echo
  // also goes once the conversation has moved on (anything new arrived after
  // it was sent), or after two minutes, instead of sticking as a phantom
  // "latest message".
  const nowS = Date.now() / 1000;
  PENDING_USER.forEach(p => { if (p.n == null) p.n = items.length; });
  PENDING_USER = PENDING_USER.filter(p =>
    !items.some(m => m.from === 'user' && (m.text || '').trim() === p.text)
    && items.length <= p.n
    && (nowS - p.ts) < 120);
  box.insertAdjacentHTML('beforeend', PENDING_USER.map(p =>
    `<div class="msg user pending" data-from="user"><div class="from">${identLabel('user')}</div><div class="text md">${mdToHtml(p.text)}</div></div>`).join(''));
  if (atBottom) box.scrollTop = box.scrollHeight;
  applyComments();
}
function renderMsgs(room) { renderBubbles(room.messages); }
// The task text is the first message of the conversation. Prepend it as a user

function withTaskBubble(items, spec, key) {
  const t = (spec || '').trim();

  if (items.some(m => m[key] === 'user' && (m.text || '').trim() === t)) return items;
  return [{ id: 'task', from: 'user', who: 'user', to: '', text: spec }].concat(items);

let PENDING_USER = [];   // optimistic echo of what you sent (solo sessions)
function showPendingUser(text) {

  box.insertAdjacentHTML('beforeend',
    `<div class="msg user pending" data-from="user"><div class="from">${identLabel('user')}</div><div class="text md">${mdToHtml(t)}</div></div>`);
  box.scrollTop = box.scrollHeight;
}
// Solo session: render its live transcript (user + assistant turns) as bubbles,
// fetched once per completed turn (see the activity-driven trigger in refresh).
let SOLO_TURN_COUNT = -1, SOLO_FETCHING = false, SOLO_SID = '', SOLO_AGENT = '', SOLO_PTY = '', _prevWorking = {}, _soloStatKey = '';

// (fetched once — a finished transcript never changes).
let SOLO_ROT = null, SOLO_PREV = { sid: '', items: [] };
const PREV_TURNS_SHOWN = 60;
function rotationText(r) {
  const k = n => Math.round((n || 0) / 1000) + 'k';
  const at = r.at ? new Date(r.at * 1000).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) + ' — ' : '';
  return `New PO session · ${at}the conversation had reached ${k(r.tokens)} tokens `
    + `(limit ${k(r.threshold)}), so a fresh session took over from PO-HANDOVER.md and ROADMAP.md. `

async function prevSessionItems(sid, agentId) {
  if (SOLO_PREV.sid === sid) return SOLO_PREV.items;

  const turns = (d.turns || []).slice(-PREV_TURNS_SHOWN);
  SOLO_PREV = { sid, items: turns.map((t, i) => ({
    id: 'p' + i, from: (t.role === 'user') ? 'user' : agentId, to: '', text: t.text })) };

// Poll a cheap size+mtime signal; re-render the transcript only when it actually

// and light (the full transcript is fetched only on a real change).
async function checkSolo() {
  if (!SOLO_SID) { renderBubbles([]); return; }
  try {
    const s = await fetch('/api/session/' + encodeURIComponent(SOLO_SID) + '?stat=1').then(r => r.json());
    if (s && typeof s.size === 'number') {
      const key = s.size + ':' + (s.mtime || 0);
      if (key === _soloStatKey) return;
      _soloStatKey = key;
      renderSolo(SOLO_SID, SOLO_AGENT, true);
    } else {
      // Older server without the stat endpoint → fall back to a full fetch that
      // re-renders only when the turn count changed (heavier, but reliable).

let ROOM_OBJ = null;   // last room payload, so we can mount the terminal on demand to read a prompt
async function renderSolo(sid, agentId, force) {
  if (!sid || SOLO_FETCHING) return;
  SOLO_FETCHING = true;
  try {
    const d = await fetch('/api/session/' + encodeURIComponent(sid) + '?full=1').then(r => r.json());
    const raw = d.turns || [];
    if (!force && raw.length === SOLO_TURN_COUNT) return;   // nothing new
    SOLO_TURN_COUNT = raw.length;
    // Drop consecutive identical turns (the transcript sometimes double-records).
    const turns = raw.filter((t, i) => i === 0 || t.role !== raw[i - 1].role || t.text !== raw[i - 1].text);
    let items = turns.slice(-120).map((t, i) => ({
      id: 's' + (turns.length - Math.min(120, turns.length) + i),
      from: (t.role === 'user') ? 'user' : agentId,
      to: '', text: t.text,
    }));
    // A PO rotated into this session: the end of the one before, then the line.
    const rot = SOLO_ROT && SOLO_ROT.toSessionId === sid ? SOLO_ROT : null;
    if (rot && rot.fromSessionId) {
      let prev = [];
      try { prev = await prevSessionItems(rot.fromSessionId, agentId); } catch (e) {}
      items = prev.concat([{ id: 'rot' + (rot.n || ''), divider: rot }], items);

async function refresh() {
  let room;
  try { room = await fetch('/api/room?id=' + encodeURIComponent(ROOM)).then(r => r.json()); }
  catch(e) { return; }
  if (!room || room.error) { $('#title').textContent = '(session not found)'; return; }
  document.title = room.title + ' — session';
  $('#title').textContent = room.title;
  const st = room.status || '';
  const notRunning = room.live === false;
  const sb = $('#status');
  sb.className = 'status ' + (notRunning ? '' : st);
  sb.textContent = notRunning ? 'not running' : st.replace('_', ' ');
  $('#hop').textContent = notRunning ? '' : `hop ${room.hopCount || 0}/${room.maxHops || 0}`;
  $('#hint').textContent = notRunning
    ? 'Not running — Resume to continue where it left off.'
    : (st === 'waiting_human' || st === 'paused')
      ? 'The agents are waiting for you — reply to resume.' : '';

  $('#input').disabled = notRunning;
  $('#resume').hidden = !notRunning;
  const pb = $('#pause');
  pb.style.display = notRunning ? 'none' : '';
  pb.textContent = st === 'paused' ? 'Resume' : 'Pause';
  pb.onclick = () => jpost('/api/room/status', { roomId: ROOM, status: st === 'paused' ? 'active' : 'paused' }).then(refresh);
  const soloMode = room.mode === 'solo' ||
    room.participants.filter(p => p.kind === 'agent').length === 1;
  document.body.classList.toggle('solo', soloMode);
  document.body.classList.toggle('notrunning', notRunning);
  // Basic session info (parity with a single-agent's detail view).
  const mem = room.participants.filter(p => p.kind === 'agent');
  ROOM_AGENTS = mem.map(m => ({ identity: m.identity, agent: m.agent, ptyId: m.ptyId, sessionId: m.sessionId, onMention: !!m.onMention }));
  ROOM_LIVE = !notRunning;
  ROOM_OBJ = room;
  const cwd = room.cwd || '';
  ensureTheme(cwd);
  $('#info').innerHTML =
    (cwd ? `<span title="${esc(cwd)}">📁 ${esc(tildeify(cwd))}</span>` : '')
    + mem.map(m => `<span class="ib-agent ${esc(m.agent)}" title="${esc(m.identity)}${m.onMention ? ' — started fresh for each review request' : ''}">${esc(m.agent)}${m.model ? ' · ' + esc(m.model) : ''}${m.onMention ? ' · on mention' : ''}</span>`).join('')
    + (soloMode ? '' : `<span>${room.messages.length} messages · hop ${room.hopCount || 0}/${room.maxHops || 0}</span>`);
  const showTerms = !document.body.classList.contains('term-hidden');
  $('#terms').hidden = notRunning;
  $('#terms').classList.toggle('on', showTerms);
  // Rich actions (header is hidden when embedded, so these show only in the popup;
  // the docked panel provides the same set in its own toolbar).
  const hasCwd = !!actCwd();
  $('#pin').hidden = false;
  $('#rename').hidden = false;
  $('#autolabel').hidden = notRunning;
  $('#explorer').hidden = !hasCwd;
  $('#ide').hidden = !hasCwd;
  $('#theme').hidden = !hasCwd;
  if (!_pinInit) { _pinInit = true; refreshPinLabel(); }
  if (agentsBuilt && agentsSig(room) !== AGENTS_SIG) {
    // A review started (a new terminal): drop the mounted ones and rebuild.
    Object.values(terms).forEach(t => { try { t.es.close(); } catch(e) {} });
    for (const k in terms) delete terms[k];

  if (!agentsBuilt && showTerms && room.participants.some(p => p.kind === 'agent' && p.ptyId)) buildAgents(room);
  if (soloMode) {
    const a = mem[0] || {};

function ptyState(info) {

  // permission/plan/confirmation prompt). Non-Claude agents fall back to PTY timing.
  const cs = a.sessionId ? liveMap[a.sessionId] : null;
  if (cs === 'busy' || cs === 'shell') return { cls: 'working', txt: 'working…' };
  if (cs === 'waiting') return { cls: 'needs', txt: '⚠ waiting for you' };

function ensureTermFor(ptyId) {

// Screen → the lines worth reading: drop box edges and rules, unwrap boxed
// content, drop the empty composer and the shortcuts footer.
function tailLines(ptyId, n) {
  let raw = readScreen(ptyId).map(l => l.replace(/\s+$/, ''));
  // Cut the composer and everything below it. Claude Code draws it either as a
  // box or as a pair of full-width rules, with the mode banner, the tip line and
  // the shortcut hint underneath — none of which says what the agent is doing.
  for (let i = Math.max(0, raw.length - 10); i < raw.length; i++) {
    const t = raw[i].trim();
    if (/^[\u256d\u250c]/.test(t) || /^[\u2500\u2501\u2550]{10,}$/.test(t)) { raw = raw.slice(0, i); break; }
  }
  const out = [];
  for (const l of raw) {
    if (!l.replace(/[\u2500-\u257f\s]/g, '')) continue;           // box drawing / rules only
    const inner = l.replace(/^\s*[\u2502\u2503]\s?/, '').replace(/\s*[\u2502\u2503]\s*$/, '').trim();
    if (!inner || /^>\s*$/.test(inner)) continue;
    if (/^\?\s*for shortcuts/i.test(inner)) continue;
    if (/^[\u23f4\u23f5]/.test(inner)) continue;                  // mode banner (bypass permissions, plan mode)
    if (/^[\u23bf\s]*Tip:/.test(inner)) continue;
    out.push(inner);
  }

}

  menu.querySelector('.tm-follow').onclick = async () => {
    closeThemeMenuS();
    try { await jpost('/api/chat-scheme', { cwd, on: false }); ensureTheme(cwd); } catch (e) {}
  };
  menu.querySelectorAll('.tm-scheme').forEach((it, i) => it.onclick = async () => {
    const theme = names[i]; closeThemeMenuS();
    try {
      await jpost('/api/theme', { cwd, theme });
      await jpost('/api/chat-scheme', { cwd, on: true });
      ensureTheme(cwd);
    } catch (e) {}
  });
  setTimeout(() => document.addEventListener('mousedown', _themeMenuOutS), 0);
};

// ---- In-place review comments -------------------------------------------
// Select text inside an agent bubble → attach a comment; collect several across
// a long message; submit them all as one structured reply. Comments live in the
// browser until submitted, and their highlights are re-applied after each poll.
const COMMENTS = [];        // {cid, mid, from, start, end, quote, note}
let _cmtSeq = 1;
let _cmtComposerOpen = false;
let _selBtn = null;

function _offsetInEl(root, node, nodeOffset) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  let off = 0, n;
  while ((n = w.nextNode())) {
    if (n === node) return off + nodeOffset;
    off += n.nodeValue.length;
  }
  return -1;
}
function _markRange(root, start, end, cid) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  let off = 0, n; const targets = [];
  while ((n = w.nextNode())) {
    const len = n.nodeValue.length;
    const s = Math.max(start, off), e = Math.min(end, off + len);
    if (s < e) targets.push({ node: n, s: s - off, e: e - off });
    off += len;
  }
  for (const t of targets.reverse()) {           // back-to-front keeps offsets valid
    try {
      const r = document.createRange();
      r.setStart(t.node, t.s); r.setEnd(t.node, t.e);
      const mk = document.createElement('mark');
      mk.className = 'cmt-hl'; mk.dataset.cid = cid;
      r.surroundContents(mk);
    } catch (e) {}
  }
}
function clearHighlights() {
  document.querySelectorAll('#msgs mark.cmt-hl').forEach(mk => {
    const p = mk.parentNode;
    while (mk.firstChild) p.insertBefore(mk.firstChild, mk);
    p.removeChild(mk); p.normalize();
  });
}
function applyComments() {
  for (const c of COMMENTS) {
    const el = document.querySelector(`#msgs .msg[data-mid="${c.mid}"] .text`);
    if (!el || el.querySelector(`mark.cmt-hl[data-cid="${c.cid}"]`)) continue;
    _markRange(el, c.start, c.end, c.cid);
  }
  renderCmtTray();
}
function hideSelBtn() { if (_selBtn) { _selBtn.remove(); _selBtn = null; } }

function _onSelect() {
  setTimeout(() => {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) { hideSelBtn(); return; }
    const range = sel.getRangeAt(0);
    const a = range.startContainer.parentElement?.closest('.msg .text.md');
    const b = range.endContainer.parentElement?.closest('.msg .text.md');
    if (!a || a !== b) { hideSelBtn(); return; }   // selection must sit in one bubble
    let start = _offsetInEl(a, range.startContainer, range.startOffset);
    let end = _offsetInEl(a, range.endContainer, range.endOffset);
    if (start > end) { const t = start; start = end; end = t; }
    if (start < 0 || end <= start) { hideSelBtn(); return; }
    const msgEl = a.closest('.msg');
    const data = { mid: msgEl.dataset.mid, from: msgEl.dataset.from, start, end,
                   quote: (a.textContent || '').slice(start, end) };
    const rect = range.getBoundingClientRect();
    showSelBtn(rect, data);
  }, 10);
}
function showSelBtn(rect, data) {
  hideSelBtn();
  const btn = document.createElement('button');
  btn.className = 'cmt-selbtn'; btn.textContent = '💬 Comment';
  document.body.appendChild(btn);
  const top = rect.bottom + 6, left = Math.min(rect.left, window.innerWidth - 130);
  btn.style.top = top + 'px'; btn.style.left = Math.max(6, left) + 'px';
  btn.addEventListener('mousedown', e => e.preventDefault());  // keep the selection
  btn.onclick = () => { hideSelBtn(); openComposer(data); };
  _selBtn = btn;
}
function openComposer(data) {
  _cmtComposerOpen = true;
  const q = data.quote.length > 200 ? data.quote.slice(0, 200) + '…' : data.quote;
  const pop = document.createElement('div');
  pop.className = 'cmt-composer';
  pop.innerHTML = `<div class="cmt-quote"></div>
    <textarea class="cmt-note" rows="3" placeholder="Your comment on this passage…"></textarea>
    <div class="cmt-actions"><button class="cmt-cancel">Cancel</button><button class="cmt-add">Add comment</button></div>`;
  pop.querySelector('.cmt-quote').textContent = '“' + q + '”';
  document.body.appendChild(pop);
  const ta = pop.querySelector('.cmt-note'); ta.focus();
  const close = () => { pop.remove(); _cmtComposerOpen = false; };
  pop.querySelector('.cmt-cancel').onclick = close;
  pop.querySelector('.cmt-add').onclick = () => {
    const note = ta.value.trim(); if (!note) { ta.focus(); return; }
    const cid = _cmtSeq++;
    COMMENTS.push({ cid, mid: data.mid, from: data.from, start: data.start, end: data.end, quote: data.quote, note });
    const el = document.querySelector(`#msgs .msg[data-mid="${data.mid}"] .text`);
    if (el) _markRange(el, data.start, data.end, cid);
    close();
    renderCmtTray();
    const s = window.getSelection(); if (s) s.removeAllRanges();
  };
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); pop.querySelector('.cmt-add').click(); }
    if (e.key === 'Escape') { e.preventDefault(); close(); }
  });
}
function renderCmtTray() {
  let tray = document.getElementById('cmt-tray');
  if (!COMMENTS.length) { if (tray) tray.remove(); return; }
  if (!tray) {
    tray = document.createElement('div'); tray.id = 'cmt-tray';
    // Docked in the chat column above the composer, so it takes its own space
    // instead of covering the messages being commented on.
    const col = document.getElementById('chatcol'), compose = document.getElementById('compose');
    if (col && compose) col.insertBefore(tray, compose); else document.body.appendChild(tray);
  }
  tray.innerHTML = `<div class="cmt-tray-head"><strong>${COMMENTS.length} comment${COMMENTS.length > 1 ? 's' : ''}</strong><span class="grow"></span><button class="cmt-submit">Submit</button><button class="cmt-clear">Clear</button></div><div class="cmt-list"></div>`;
  const list = tray.querySelector('.cmt-list');
  COMMENTS.forEach(c => {
    const item = document.createElement('div');
    item.className = 'cmt-item'; item.dataset.cid = c.cid;
    const q = document.createElement('div'); q.className = 'cmt-item-q';
    q.textContent = '“' + (c.quote.length > 60 ? c.quote.slice(0, 60) + '…' : c.quote) + '”';
    const nn = document.createElement('div'); nn.className = 'cmt-item-n'; nn.textContent = c.note;
    const x = document.createElement('button'); x.className = 'cmt-item-x'; x.textContent = '✕'; x.title = 'Remove';
    item.append(q, nn, x);
    x.onclick = (e) => { e.stopPropagation(); const i = COMMENTS.findIndex(z => z.cid === c.cid); if (i >= 0) COMMENTS.splice(i, 1); clearHighlights(); applyComments(); };
    item.onclick = () => { const mk = document.querySelector(`#msgs mark.cmt-hl[data-cid="${c.cid}"]`); if (mk) mk.scrollIntoView({ behavior: 'smooth', block: 'center' }); };
    list.appendChild(item);
  });
  tray.querySelector('.cmt-submit').onclick = submitComments;
  tray.querySelector('.cmt-clear').onclick = () => { COMMENTS.length = 0; clearHighlights(); renderCmtTray(); };
}
async function submitComments() {
  if (!COMMENTS.length) return;
  const authors = [...new Set(COMMENTS.map(c => c.from))];
  const to = authors.length === 1 ? authors[0] : '';
  const body = `## Review comments (${COMMENTS.length})\n\n` +
    COMMENTS.map((c, i) => `**${i + 1}.** > ${c.quote.replace(/\s*\n\s*/g, ' ').trim()}\n\n${c.note}`).join('\n\n');
  try {
    if (SOLO_PTY) {
      await sendSolo(body);
      COMMENTS.length = 0; clearHighlights(); renderCmtTray();
      setTimeout(checkSolo, 1200);
      return;
    }
    await jpost('/api/room/say', { roomId: ROOM, text: body, to });
    COMMENTS.length = 0; clearHighlights(); renderCmtTray(); refresh();
  } catch (e) { alert('Failed to submit comments — try again.'); }
}
$('#msgs').addEventListener('mouseup', _onSelect);
$('#msgs').addEventListener('touchend', _onSelect);
$('#msgs').addEventListener('mousedown', () => hideSelBtn());
// A touch selection is made with its handles after the finger lifts, so
// touchend sees an empty or half-made selection. Follow the selection itself.
if (TOUCH) {
  let selTimer = 0;
  document.addEventListener('selectionchange', () => { clearTimeout(selTimer); selTimer = setTimeout(_onSelect, 300); });
}
document.addEventListener('mousedown', e => { if (_selBtn && e.target !== _selBtn) hideSelBtn(); });
$('#end').onclick = async () => {
  if (!confirm('End this session and stop the agent(s)?')) return;
  try { await jpost('/api/room/close', { roomId: ROOM }); } catch(e) {}
  window.close();
};
$('#resume').onclick = async () => {
  $('#resume').disabled = true;
  try {
    await jpost('/api/room/resume', { roomId: ROOM });
    // ptyIds changed → tear down the dead terminals and rebuild.
    Object.values(terms).forEach(t => { try { t.es.close(); } catch(e) {} });
    for (const k in terms) delete terms[k];
    agentsBuilt = false;
    await refresh();
  } catch (e) { /* stay ended */ }
  $('#resume').disabled = false;
};
// In a solo session the terminal is the main surface — refocus it when the
// window regains focus so you can just start typing.
window.addEventListener('focus', () => {
  if (!document.body.classList.contains('solo')) return;
  const t = Object.values(terms)[0];
  if (t) { try { t.term.focus(); } catch (e) {} }
});
// Floating window (opened by the dashboard) → offer "Dock" to move it back into
// the panel. When embedded as the panel's iframe, this is hidden (the panel has
// its own "Pop out").
const inIframe = window.parent !== window;
if (!inIframe && window.opener) {
  const dockBtn = $('#dock');
  dockBtn.hidden = false;
  dockBtn.onclick = () => {
    try { window.opener.postMessage({ type: 'dock-session', roomId: ROOM }, '*'); } catch (e) {}
    window.close();
  };
}
if (!ROOM) { $('#title').textContent = '(no session id)'; }
else { refresh(); setInterval(refresh, 2000); }
</script>
</body>
