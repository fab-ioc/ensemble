<script>
// Appearance, resolved before first paint so the page never flashes the wrong
// theme. A theme is a complete token set under :root[data-theme="<name>"].
// Light is the default whatever the OS says; "system" follows the OS between
// Light and Dark. The choice follows the person, not the browser: it lives on
// the hub (settings.theme), and localStorage['cd-theme'] is only its
// first-paint cache. index.html, session.html and fileview.html carry the same
// script; change all three together.
(function () {
  var SCHEME = { light: 'light', dark: 'dark', dim: 'dark', paper: 'light', contrast: 'light', fjord: 'dark' };
  var mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
  function stored() {
    try { return localStorage.getItem('cd-theme') || 'light'; } catch (e) { return 'light'; }
  }
  function apply() {
    var pref = stored();
    var name = pref === 'system' ? (mq && mq.matches ? 'dark' : 'light') : (SCHEME[pref] ? pref : 'light');
    var root = document.documentElement;
    root.dataset.theme = name;
    root.dataset.scheme = SCHEME[name];
    try { window.dispatchEvent(new CustomEvent('cd-theme', { detail: { pref: pref, theme: name } })); } catch (e) {}
  }
  // The accent colour follows the person the same way: settings.accent on the
  // hub, localStorage['cd-accent'] its first-paint cache. Nothing stored, or
  // the hub's "default", keeps the theme's own accent. The text on a custom
  // accent is picked from the accent itself, so a primary button stays
  // readable in every theme (dark themes put dark text on their pale accent).
  var ink = null;
  function storedAccent() {
    try { return localStorage.getItem('cd-accent') || ''; } catch (e) { return ''; }
  }
  // [r, g, b] of an opaque CSS colour, or null when the browser does not take
  // it or it is see-through (no text colour is sure to read on that).
  function rgbOf(color) {
    try {
      if (/currentcolor/i.test(color)) return null;   // the canvas reads it as black
      ink = ink || document.createElement('canvas').getContext('2d');
      // A colour the canvas refuses leaves the previous one: two different
      // starting colours then read back differently.
      ink.fillStyle = '#010203'; ink.fillStyle = String(color || '');
      var v = String(ink.fillStyle), m;
      ink.fillStyle = '#040506'; ink.fillStyle = String(color || '');
      if (String(ink.fillStyle) !== v) return null;
      if ((m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(v))) {
        return [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)];
      }
      m = v.match(/[\d.]+/g);
      if (!m || m.length < 3 || (m.length > 3 && +m[3] < 1)) return null;
      return [+m[0], +m[1], +m[2]];
    } catch (e) { return null; }
  }
  // The text colour on the accent that clears 4.5:1: white or the near-black
  // #101214, whichever reads better, and pure black for the mid tones where
  // neither does (black clears 4.6:1 on every one of those).
  function accentFg(rgb) {
    function lin(v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
    function lum(c) { return 0.2126 * lin(c[0]) + 0.7152 * lin(c[1]) + 0.0722 * lin(c[2]); }
    var L = lum(rgb) + 0.05, onWhite = 1.05 / L, onInk = L / (lum([16, 18, 20]) + 0.05);
    if (Math.max(onWhite, onInk) >= 4.5) return onWhite >= onInk ? '#FFFFFF' : '#101214';
    return '#000000';
  }
  function applyAccent() {
    var color = storedAccent(), rgb = color ? rgbOf(color) : null;
    var s = document.documentElement.style;
    if (rgb) {
      s.setProperty('--accent', color);
      s.setProperty('--accent-fg', accentFg(rgb));
    } else {
      s.removeProperty('--accent');
      s.removeProperty('--accent-fg');
    }
    try { window.dispatchEvent(new CustomEvent('cd-accent', { detail: { accent: rgb ? color : '' } })); } catch (e) {}
  }
  function put(body) {
    return fetch('/api/settings', { method: 'PUT', headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify(body) });
  }
  // A choice made here is not undone by a hub reply that was already on its
  // way: `epoch` moves with every choice (here or in another tab) and every
  // finished save, and sync() takes the hub's accent only when it did not move
  // while the reply was out and every choice has been saved.
  var epoch = 0, chosen = 0, saved = 0, saving = false, queued = null;
  function chooseAccent(color) {
    try { if (color) localStorage.setItem('cd-accent', color); else localStorage.removeItem('cd-accent'); } catch (e) {}
    epoch++; chosen++;
    applyAccent();
  }
  // Saves reach the hub one at a time and only the newest waiting one is sent,
  // so the hub ends on the last choice. Resolves with the hub's settings, or
  // with null when a newer save took this one's place.
  function saveAccent(color) {
    return new Promise(function (resolve, reject) {
      if (queued) queued.resolve(null);
      queued = { want: color || 'default', chosen: chosen, resolve: resolve, reject: reject };
      pump();
    });
  }
  function pump() {
    if (saving || !queued) return;
    var job = queued;
    queued = null; saving = true;
    put({ accent: job.want }).then(function (r) {
      return r.json().catch(function () { return null; }).then(function (b) {
        if (!r.ok) throw new Error(r.status + ' ' + (b ? JSON.stringify(b) : ''));
        return b;
      });
    }).then(job.resolve, job.reject).then(function () {
      saving = false; saved = Math.max(saved, job.chosen); epoch++;
      pump();
    });
  }
  // Adopt the hub's choices, which another device may have changed. If the hub
  // has none yet, hand it this browser's so a choice made before is kept.
  function sync() {
    var at = epoch;
    fetch('/api/settings', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (s) {
        if (!s) return;
        if (typeof s.theme === 'string') {
          var local = stored();
          if (s.theme && s.theme !== local) {
            try { localStorage.setItem('cd-theme', s.theme); } catch (e) {}
            apply();
          } else if (!s.theme && local !== 'light') {
            put({ theme: local }).catch(function () {});
          }
        }
        // A hub from before the accent was synced sends none: leave it be.
        var settled = at === epoch && !saving && !queued && saved === chosen;
        if (typeof s.accent === 'string' && settled) {
          var mine = storedAccent(), want = s.accent === 'default' ? '' : s.accent;
          if (s.accent && want !== mine) {
            try {
              if (want) localStorage.setItem('cd-accent', want); else localStorage.removeItem('cd-accent');
            } catch (e) {}
            applyAccent();
          } else if (!s.accent && mine && rgbOf(mine)) {
            saveAccent(mine).catch(function () {});
          }
        }
      }).catch(function () {});
  }
  window.cdTheme = { apply: apply, sync: sync, stored: stored, scheme: SCHEME,
                     applyAccent: applyAccent, storedAccent: storedAccent, rgbOf: rgbOf, put: put,
                     chooseAccent: chooseAccent, saveAccent: saveAccent };
  apply();
  applyAccent();
  if (mq && mq.addEventListener) mq.addEventListener('change', apply);
  window.addEventListener('storage', function (ev) {
    if (ev.key === 'cd-theme') apply();
    if (ev.key === 'cd-accent') { epoch++; applyAccent(); }
  });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) sync(); });
  sync();
})();
</script>

<body>
<header>

  <button id="autolabel" hidden title="Ask Claude to suggest a label from the conversation">✨ Auto</button>
  <button id="explorer" hidden title="Open the working folder on the host">📂 Files</button>
  <button id="ide" hidden title="Open the project in its editor (on the host)">🧠 IDE</button>
  <button id="theme" hidden title="The chat follows the dashboard theme; switch this task's chat to its folder's terminal colours instead">🎨 Chat colours</button>

</header>
<div id="info"></div>
<main>
  <div id="chatcol">
    <div id="msgpane">

      <div id="goto-note" role="status" hidden><span></span><button type="button" class="goto-x" title="Dismiss this note">Dismiss</button></div>
      <div id="msgs"></div>

    <div id="compose">
      <div class="dim" id="hint"></div>
      <textarea id="input" placeholder="Message the agents — Ctrl+Enter to send. Start with @codex or @claude to direct it to one."></textarea>
      <div style="display:flex; gap:8px; align-items:center">
        <span class="dim">To</span>

    </div>
  </div>
  <div id="agentcol"></div>
</main>
<div id="tailpop" hidden></div>
<script>
const qs = new URLSearchParams(location.search);
// ?id= from the dashboard; ?room= (with &msg=) from a link to one of its balloons.
const ROOM = qs.get('id') || qs.get('room');
let OPERATOR = 'you';   // how the human ("user") is shown — nickname / git name
fetch('/api/settings').then(r => r.json()).then(s => {
  OPERATOR = s.operatorName || s.operatorNickname || 'you';
  if (CHAT_NAMES.operator !== OPERATOR) { CHAT_NAMES.operator = OPERATOR; refChanged(); }
}).catch(() => {});
// The hub's port, so a link to its loopback address can be made this page's.
fetch('/api/config').then(r => r.json()).then(c => { if (c && c.port) HUB_PORT = String(c.port); }).catch(() => {});
if (qs.get('embed')) document.body.classList.add('embed');
// ?agent=<identity> — arrived from a notification about that specific agent, so
// land on its terminal rather than on a page with the terminals switched off.
const FOCUS_AGENT = (qs.get('agent') || '').trim();
if (!FOCUS_AGENT) document.body.classList.add('term-hidden');   // terminals off by default
// The on-screen keyboard. Android shrinks the page when it opens (the viewport
// tag asks for that); iOS shrinks only the visual viewport and scrolls it. The
// page is kept exactly as tall as what is visible, and back at the top, so the
// composer at its foot is never under the keyboard. Touch screens only.
const TOUCH = window.matchMedia('(pointer: coarse)').matches;
if (TOUCH && window.visualViewport) {
  // Set only while the visible viewport is shorter than the page (the iOS
  // keyboard); otherwise 100dvh, so a stale reading can never shorten the page.
  const fitVisualViewport = () => {
    const root = document.documentElement.style;
    if (visualViewport.height < window.innerHeight - 1) root.setProperty('--vv-h', Math.round(visualViewport.height) + 'px');
    else root.removeProperty('--vv-h');
    if (visualViewport.offsetTop > 0) window.scrollTo(0, 0);
  };
  visualViewport.addEventListener('resize', fitVisualViewport);
  fitVisualViewport();
}
const $ = s => document.querySelector(s);
// Write only what changed: a poll that rewrites the same text still replaces
// the node, and the page repaints under whatever the person is doing.
const setText = (el, s) => { if (el && el.textContent !== s) el.textContent = s; };
const setHtml = (el, h) => { if (el && el._html !== h) { el._html = h; el.innerHTML = h; } };
const esc = s => (s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Minimal, self-contained markdown → HTML for chat bubbles. Escape-first so it's
// XSS-safe: fenced/inline code is pulled out to placeholders, the rest is escaped,
// then inline spans + block structure are applied, then code is restored (escaped).
// ---- Links in rendered text: begin shared block ----------------------------
// index.html, session.html and fileview.html carry this block word for word;
// tests/test_links.py fails when the copies drift. The page supplies esc() and
// fileHref(path, line). Whatever an agent writes that names a place becomes a
// link that works for the person reading it, wherever they are reading it:
//   * the hub's own loopback address (http://127.0.0.1:8765/...) becomes this
//     page's address, so it opens from another computer on the tailnet too;
//   * file://... and local paths (C:\..., \\server\..., ~/..., /..., docs/a.md,
//     and name.py:120 with a line) open in the file viewer, which reads them
//     through the hub; a folder opens as a listing;
//   * a task id (room-1a2b3c4d) opens that task;
//   * a loopback address on another port works only on the hub machine, so
//     anywhere else it is plain text that says so, not a link that fails.
const ABS_PATH_RE = /^(?:[A-Za-z]:[\\\/]|\\\\|~\/|\/)/;   // C:\dir, C:/dir, \\unc, ~/x, /x
// mdToHtml escapes before linkifying, so a path arrives with entities in it.
const unescPath = s => (s || '').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
  .replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&');
// "dashboard.py:4620" or ":4620:8": the file, and the line for the viewer.
function splitLine(s) {
  const m = (s || '').match(/:(\d+)(?::\d+)?$/);
  return m && /\.\w{1,8}$/.test(s.slice(0, m.index))
    ? { path: s.slice(0, m.index), line: +m[1] } : { path: s || '', line: 0 };
}
const looksFilePath = s => {
  const t = splitLine((s || '').trim()).path;
  if (ABS_PATH_RE.test(t)) return /\S+\.\w{1,8}$/.test(t);
  return /^(?:\.\.?[\\\/])?(?:[\w.-]+[\\\/])+[\w.-]+\.\w{1,8}$/.test(t)
      || /^[\w-]+\.(?:md|txt|py|js|ts|tsx|jsx|html|css|json|yaml|yml|toml|csv|pdf|png|jpg|jpeg|gif|svg|sh|ps1|sql|xml|log|ini|cfg)$/.test(t);
};
// A folder: a Windows, UNC or home path with no extension, or a macOS/Linux
// home path ending in a separator. Only where it stands alone (a code span, a
// link target): in running text "C:\temp and" would swallow the sentence.
const looksDirPath = s => {
  const t = (s || '').trim();
  return (/^(?:[A-Za-z]:[\\\/]|\\\\[^\\\/\s]|~\/)/.test(t) && !/\.\w{1,8}$/.test(t) && !/[<>|?*"]|\s{2}/.test(t))
      || /^\/(?:Users|home)\/\S*\/$/.test(t);
};
function resolvePath(p, base) {
  p = (p || '').trim();
  if (ABS_PATH_RE.test(p) || !base) return p;
  const sep = base.includes('\\') ? '\\' : '/';
  return base.replace(/[\\\/]+$/, '') + sep + p.replace(/^\.[\\\/]/, '').replace(/[\\\/]/g, sep);
}
const LOOPBACK_HOST_RE = /^(?:127(?:\.\d{1,3}){3}|localhost|\[::1\])$/i;
let HUB_PORT = '';   // the hub's port, from /api/config; until it arrives, this page's own
const hubPort = () => HUB_PORT || location.port || (location.protocol === 'https:' ? '443' : '80');
const onHubMachine = () => LOOPBACK_HOST_RE.test(location.hostname);
// file:///C:/a%20b.md is C:/a b.md; file://srv/share/x is \\srv\share\x; file:///home/x is /home/x
function filePathOfUrl(u) {
  let p = u.replace(/^file:/i, '');
  try { p = decodeURIComponent(p); } catch (e) {}
  if (/^\/\/\/[A-Za-z]:/.test(p)) return p.slice(3);
  if (/^\/\/[^\/]/.test(p)) return '\\\\' + p.slice(2).replace(/\//g, '\\');
  return p.replace(/^\/\//, '');
}
// What a URL an agent wrote opens for the person reading it here: a file
// {file, line}, a page {href}, or {dead} when it only exists on the hub machine.
function urlTarget(raw) {
  const u = unescPath(raw);
  if (/^file:/i.test(u)) { const s = splitLine(filePathOfUrl(u)); return { file: s.path, line: s.line }; }
  let x = null;
  try { x = new URL(u); } catch (e) { return { href: u }; }
  if (LOOPBACK_HOST_RE.test(x.hostname)) {
    const port = x.port || (x.protocol === 'https:' ? '443' : '80');
    if (port === hubPort()) return { href: location.origin + x.pathname + x.search + x.hash };
    if (!onHubMachine()) return { dead: x.host };
  }
  return { href: u };
}
// A sentence's full stop, comma or closing bracket is not part of its URL.
function trimUrlTail(u) {
  let tail = '', m;
  for (;;) {
    if ((m = u.match(/(?:[.,;:!?]|&quot;|&#39;|&gt;)$/))) { tail = m[0] + tail; u = u.slice(0, -m[0].length); }
    else if (u.endsWith(')') && u.split('(').length < u.split(')').length) { tail = ')' + tail; u = u.slice(0, -1); }
    else return [u, tail];
  }
}
const A_NEW = ' target="_blank" rel="noopener"';
const taskLinkHtml = (id, text) => `<a href="/?task=${id}" data-task="${id}"${A_NEW} class="task-link">${text}</a>`;
const fileLinkHtml = (p, text, line) => `<a href="${fileHref(p, line)}"${A_NEW} class="file-link">${text}</a>`;
function urlLinkHtml(raw, text) {
  const t = urlTarget(raw);
  if (t.file != null) return fileLinkHtml(t.file, text, t.line);
  if (t.dead) return `<span class="dead-link" title="${esc(t.dead)} is an address on the hub machine itself">${text} (only on the hub machine)</span>`;
  return `<a href="${esc(t.href)}"${A_NEW}>${text}</a>`;
}
// [text](target): a web or file URL, an #anchor on this page, a dashboard
// page, a task, a file or a folder. Anything else stays as it was written.
function mdLinkHtml(m, txt, target) {
  const t = unescPath(target.trim().replace(/^&lt;([\s\S]*)&gt;$/, '$1'));
  if (/^#/.test(t) || /^mailto:/i.test(t)) return `<a href="${esc(t)}">${txt}</a>`;
  if (/^(?:https?|file):/i.test(t)) return urlLinkHtml(t, txt);
  const task = t.match(/^(?:\/?\?task=)?(room-[0-9a-f]{8})$/);
  if (task) return taskLinkHtml(task[1], txt);
  if (/^\/(?:fileview|session)?(?:\?|$)/.test(t)) return `<a href="${esc(t)}"${A_NEW}>${txt}</a>`;
  if (looksFilePath(t) || looksDirPath(t)) { const s = splitLine(t); return fileLinkHtml(s.path, txt, s.line); }
  return m;
}
// A `code span` that names a place is a link too, and still reads as code.
function codeSpanHtml(body) {
  const code = `<code class="ic">${esc(body)}</code>`;
  const t = body.trim();
  if (/^room-[0-9a-f]{8}$/.test(t)) return taskLinkHtml(t, code);
  if (/^(?:https?|file):\/\/\S+$/i.test(t)) return urlLinkHtml(t, code);
  if (looksFilePath(t) || looksDirPath(t)) { const s = splitLine(t); return fileLinkHtml(s.path, code, s.line); }
  return code;
}
// Running text, already escaped, in one pass so nothing is linked twice. The
// links are parked in `keep` and put back by unlinkify, after bold and italics.
// A Windows path may have spaces in its folder and file names ("Ensemble
// Dashboard\Terms and Conditions.md"), and a sentence may begin with one
// ("C:\foo please check docs\readme.md"). What is taken from the drive to the
// extension is linked whole when it is sure to be a path, and otherwise left
// as text, all of it, so that no piece of it opens a different file: a name
// with spaces reads as a name when it starts with a capital or a digit and
// has at most four words ("New folder", "War of the Worlds.md"). A code span
// or [text](target) takes any path as written. A path's & arrives as &amp;.
// A markdown target may hold one level of brackets: [x](https://w/Foo_(bar)).
// Linear on any line: the expression is tried from every character, so no
// part of it may scan past the place where the next try would start. A link's
// text stops at a [, and a path starts at a ( or _ only where that character
// could not be inside the path itself; otherwise a 50,000-character line of
// [ or (/ took seconds, one scan to its end per opener.

}
$('#msgs').addEventListener('scroll', msgsScrolled, { passive: true });
// A conversation opens at its end, also when its frame is shown again (the
// PO's drawer closed and opened, another project's PO and back): a hidden frame
// measures 0 high, so coming back from 0 is opening it. At the end, a change of
// size (the tray, the prompt card, the keyboard) keeps the chat at the end.
let _msgsH = -1;
function msgsResized() {
  const box = $('#msgs'), h = box.clientHeight;
  // Hidden while at the end (the drawer closed): read, as leaving the page.
  if (!h && _msgsH > 0 && STICK && CHAT_DRAWN) markRead();
  if (h && _msgsH === 0) {
    if (GOTO) { GOTO_OPEN = true; landPending(); if (CHAT_DRAWN) catchUpOpen(); }
    else { toLatest(); if (CHAT_DRAWN) catchUpOpen(); }
  }
  else if (h && STICK) box.scrollTop = box.scrollHeight;
  _msgsH = h;
  showLatest();
}
try { new ResizeObserver(msgsResized).observe($('#msgs')); } catch (e) {}
window.addEventListener('resize', msgsResized);
// A task link inside the dashboard (its task panel, the PO's drawer) opens the
// task there, beside you. In a window of its own it opens the dashboard in a
// new tab, on that task.
document.addEventListener('click', ev => {
  const a = ev.target.closest && ev.target.closest('a[data-task]');
  if (!a || ev.button !== 0 || ev.metaKey || ev.ctrlKey || ev.shiftKey) return;
  let host = null;
  try { if (window.parent !== window && window.parent.location.origin === location.origin) host = window.parent; } catch (e) {}
  if (!host) return;
  ev.preventDefault();
  host.postMessage({ type: 'open-task', roomId: a.dataset.task, agent: a.dataset.agent || '' }, location.origin);
});
// A balloon link's chip: in this conversation it lands on the balloon; inside
// the dashboard, the dashboard opens that task or PO at it; on its own, this
// page goes there. With a modifier key it is a link, opening a new tab.
document.addEventListener('click', ev => {
  const a = ev.target.closest && ev.target.closest('a.ref-chip, a.sup-link, a.cu-link');
  if (!a || ev.button !== 0 || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey) return;
  ev.preventDefault();
  const room = a.dataset.refRoom || ROOM, msg = a.dataset.refMsg;
  if (room === ROOM) { gotoMsg(msg); return; }
  let host = null;
  try { if (window.parent !== window && window.parent.location.origin === location.origin) host = window.parent; } catch (e) {}
  if (host) host.postMessage({ type: 'open-msg', roomId: room, msg }, location.origin);
  else location.href = a.href;
});
$('#goto-note .goto-x').addEventListener('click', () => showGotoNote(''));
$('#msgs').addEventListener('mouseup', _onSelect);
$('#msgs').addEventListener('touchend', _onSelect);
$('#msgs').addEventListener('mousedown', () => hideSelBtn());
// A touch selection is made with its handles after the finger lifts, so
// touchend sees an empty or half-made selection. Follow the selection itself.
if (TOUCH) {
  let selTimer = 0;
  document.addEventListener('selectionchange', () => { clearTimeout(selTimer); selTimer = setTimeout(_onSelect, 300); });
}
document.addEventListener('mousedown', e => { if (_selBtn && e.target !== _selBtn) hideSelBtn(); });
$('#end').onclick = async () => {
  if (!confirm('End this session and stop the agent(s)?')) return;
  try { await jpost('/api/room/close', { roomId: ROOM }); } catch(e) {}
  window.close();
};
$('#resume').onclick = async () => {
  $('#resume').disabled = true;
  try {
    await jpost('/api/room/resume', { roomId: ROOM });
    // ptyIds changed → tear down the dead terminals and rebuild.
    Object.values(terms).forEach(t => { try { t.es.close(); } catch(e) {} });
    for (const k in terms) delete terms[k];
    agentsBuilt = false;
    await refresh();
  } catch (e) { /* stay ended */ }
  $('#resume').disabled = false;
};
// In a solo session the terminal is the main surface — refocus it when the
// window regains focus so you can just start typing.
window.addEventListener('focus', () => {
  if (!document.body.classList.contains('solo')) return;
  const t = Object.values(terms)[0];
  if (t) { try { t.term.focus(); } catch (e) {} }
});
// Floating window (opened by the dashboard) → offer "Dock" to move it back into
// the panel. When embedded as the panel's iframe, this is hidden (the panel has
// its own "Pop out").
const inIframe = window.parent !== window;
if (!inIframe && window.opener) {
  const dockBtn = $('#dock');
  dockBtn.hidden = false;
  dockBtn.onclick = () => {
    try { window.opener.postMessage({ type: 'dock-session', roomId: ROOM }, '*'); } catch (e) {}
    window.close();
  };
}
if (!ROOM) { $('#title').textContent = '(no session id)'; }
else { refresh(); setInterval(refresh, 2000); }
</script>
</body>
