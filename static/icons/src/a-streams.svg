<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ensemble, concept A "Streams": three agents' lines of work (the three
       coloured strands) run together into one result (the white line). -->
  <defs>
    <linearGradient id="ground-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A3D"/>
      <stop offset=".55" stop-color="#E0306E"/>
      <stop offset="1" stop-color="#6A1FB8"/>
    </linearGradient>
  </defs>
  <g id="ground"><rect width="512" height="512" fill="url(#ground-fill)"/></g>
  <g id="motif" fill="none" stroke-linecap="round" stroke-width="46">
    <path d="M104 168 C200 168 222 256 300 256" stroke="#FFE066"/>
    <path d="M104 344 C200 344 222 256 300 256" stroke="#7CF3FF"/>
    <path d="M104 256 H300" stroke="#FFFFFF"/>
    <path d="M300 256 H404" stroke="#FFFFFF" stroke-width="68"/>
  </g>
</svg>
