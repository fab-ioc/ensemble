<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Panel</title>
<script>
// Ensemble's pop-out page for its Dock windows (createDock's popUrl in index.html), in place of the library's own
// (static/dock/src/popout.html), which closes when the main page reloads (#204). The main page moves a panel into
// #dk-pop-root and keeps drawing it, as with the library's page. When the main page reloads (by hand, after a merge,
// after a hub restart), this window stays open with what it shows, and the page that loads next takes it back
// (window.ensPopAdopt in index.html: the same panel, drawn again here, its file at the same place). It closes when the
// main window closes, when the page that loads says it has no use for it, or when no Ensemble page comes back.
(function () {
  try {
    var from = window.opener && window.opener.document.documentElement;
    if (from) ['data-theme', 'data-scheme', 'class', 'style'].forEach(function (a) {
      var v = from.getAttribute(a);
      if (v !== null) document.documentElement.setAttribute(a, v);
    });
  } catch (e) { /* not opened by the app */ }
  var shut = window.close.bind(window);
  // The main page closes its windows as it goes (the library, at pagehide). A reload is not a close: the page says
  // it is going (ensPopLeaving) and this window waits for the next one. A tab closed is seen below (opener.closed).
  window.close = function () {
    try { if (window.opener && !window.opener.closed && window.opener.ensPopLeaving) return; } catch (e) { /* gone */ }
    shut();
  };
  var owner = null;   // the main page's document that draws this window
  var since = 0;      // when that page went
  var WAIT_PAGE = 15000, WAIT_HUB = 10 * 60000;
  setInterval(function () {
    var o = window.opener;
    if (!o || o.closed) { shut(); return; }
    var d = null;
    try { d = o.document; } catch (e) { d = null; }   // an error page while the hub restarts
    if (d && owner === null) { owner = d; return; }
    if (d && d === owner) { since = 0; return; }
    if (!since) since = Date.now();
    var r = 'later', page = false;
    try { page = typeof o.ensPopAdopt === 'function'; if (page) r = o.ensPopAdopt(window); } catch (e) { r = 'later'; }
    if (r === 'yes') { owner = d; since = 0; return; }
    // No Ensemble page there once it has loaded (another address), or none at all for long (the hub stays down).
    var gone = d && d.readyState === 'complete' && !page ? WAIT_PAGE : WAIT_HUB;
    if (r === 'no' || Date.now() - since > gone) shut();
  }, 250);
})();
</script>
<style>html, body { margin: 0; height: 100%; }</style>
</head>
<body class="dk-popwin">
<div id="dk-pop-root" class="dk-pop-root"><p class="dk-pop-wait">Opening…</p></div>
</body>
</html>
