<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>file</title>
<!-- Syntax highlighting is this page's own (HL, below), coloured by the
     --code-* tokens of each theme. Nothing is fetched from a CDN: the hub is
     read over a tailnet that may have no route out, and a highlighter that
     never arrived left every file grey. -->
<script>
// Appearance, resolved before first paint so the page never flashes the wrong
// theme. A theme is a complete token set under :root[data-theme="<name>"].
// Light is the default whatever the OS says; "system" follows the OS between
// Light and Dark. The choice follows the person, not the browser: it lives on
// the hub (settings.theme), and localStorage['cd-theme'] is only its
// first-paint cache. index.html, session.html and fileview.html carry the same
// script; change all three together.
(function () {
  var SCHEME = { light: 'light', dark: 'dark', dim: 'dark', paper: 'light', contrast: 'light', fjord: 'dark' };
  var mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
  function stored() {
    try { return localStorage.getItem('cd-theme') || 'light'; } catch (e) { return 'light'; }
  }
  function apply() {
    var pref = stored();
    var name = pref === 'system' ? (mq && mq.matches ? 'dark' : 'light') : (SCHEME[pref] ? pref : 'light');
    var root = document.documentElement;
    root.dataset.theme = name;
    root.dataset.scheme = SCHEME[name];
    try { window.dispatchEvent(new CustomEvent('cd-theme', { detail: { pref: pref, theme: name } })); } catch (e) {}
  }
  // Adopt the hub's choice, which another device may have changed. If the hub
  // has none yet, hand it this browser's so a choice made before is kept.
  function sync() {
    fetch('/api/settings', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (s) {
        if (!s || typeof s.theme !== 'string') return;
        var local = stored();
        if (s.theme && s.theme !== local) {
          try { localStorage.setItem('cd-theme', s.theme); } catch (e) {}
          apply();
        } else if (!s.theme && local !== 'light') {
          fetch('/api/settings', { method: 'PUT', headers: { 'Content-Type': 'application/json' },
                                   body: JSON.stringify({ theme: local }) }).catch(function () {});
        }
      }).catch(function () {});
  }
  window.cdTheme = { apply: apply, sync: sync, stored: stored, scheme: SCHEME };
  apply();
  if (mq && mq.addEventListener) mq.addEventListener('change', apply);
  window.addEventListener('storage', function (ev) { if (ev.key === 'cd-theme') apply(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) sync(); });
  sync();
})();
</script>

  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  body { margin:0; min-height:100vh; background:var(--surface); color:var(--fg);
    font:var(--fs-300)/var(--lh-300) var(--font-sans); }
  header { position:sticky; top:0; display:flex; flex-wrap:wrap; align-items:center; gap:var(--s-200);
    padding:var(--s-200) var(--s-400); background:var(--surface); border-bottom:1px solid var(--border); z-index:5; }
  header .name { font-weight:600; word-break:break-all; }
  /* What the file is, at a glance: language, lines, size. */
  header .meta { color:var(--fg-muted); font-size:var(--fs-200); white-space:nowrap; font-variant-numeric:tabular-nums; }
  header .grow { flex:1; }
  header .btn { display:inline-flex; align-items:center; height:24px; color:var(--fg); text-decoration:none; font:inherit;
    font-size:var(--fs-200); border:1px solid var(--border-strong); padding:0 var(--s-200); border-radius:var(--r-200);
    background:var(--surface); white-space:nowrap; }
  header button.btn { cursor:pointer; }
  header .btn:hover { background:var(--hover); }
  header .btn:focus-visible { outline:none; box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--focus-ring); }
  /* A choice between two ways of showing the same file, and the wrap switch:
     the one showing is selected. */
  header .btn[aria-pressed="true"] { background:var(--selected-bg); color:var(--selected-fg); border-color:var(--selected-fg); }
  /* In a narrow pane (the task panel's Workspace is about 350px) the header
     keeps to one row: the name gives way first, then the details, then the
     Comment label, which its icon and title still carry. */
  @media (max-width: 520px) {
    header { flex-wrap:nowrap; padding:var(--s-100) var(--s-200); gap:var(--s-100); }
    header .name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; word-break:normal; }
    header .grow { flex:1 1 0; min-width:0; }
    header .btn { flex:none; }
    #cmt-file .lbl { display:none; }
  }
  @media (max-width: 440px) { header .meta { display:none; } }
  .seg { display:inline-flex; }
  .seg .btn + .btn { margin-left:-1px; }
  .seg .btn:first-child { border-top-right-radius:0; border-bottom-right-radius:0; }
  .seg .btn:last-child { border-top-left-radius:0; border-bottom-left-radius:0; }
  main { max-width:1040px; margin:0 auto; padding:var(--s-600) var(--s-400) 60px; }
  .err { color:var(--c-danger-fg); padding:var(--s-400); }
  /* What the viewer could not do, said out loud rather than silently. */
  .note { margin:0 0 var(--s-300); padding:var(--s-200) var(--s-300); border:1px solid var(--border); border-left:3px solid var(--border-strong);
    border-radius:var(--r-200); background:var(--surface-sunken); font-size:var(--fs-200); color:var(--fg-muted); }
  .note div + div { margin-top:var(--s-100); }
  .note a { color:var(--link); }
  img.file, iframe.file { max-width:100%; border:1px solid var(--border); border-radius:var(--r-300); background:#FFFFFF; } /* document paper, not chrome */
  iframe.file { width:100%; height:calc(100vh - 96px); }

  /* ---- Code: an editor, not a card ---------------------------------------
     The code fills the page under the header and scrolls on its own, so the
     line numbers and the header stay put. Every line is a row that carries
     its number; the number is drawn, never text, so selecting, copying and
     commenting see exactly the file. */
  body.code-mode { height:100vh; height:100dvh; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
  body.code-mode header { position:static; flex:none; }
  body.code-mode main { flex:1; min-height:0; max-width:none; width:100%; margin:0; padding:0; display:flex; flex-direction:column; }
  body.code-mode main > .note { margin:var(--s-200) var(--s-400) 0; }
  .code { position:relative; flex:1; min-height:0; overflow:auto; padding:var(--s-200) 0 var(--s-600);
    font-family:var(--font-mono); font-size:var(--fs-200); line-height:var(--lh-300); tab-size:4; color:var(--fg);
    font-variant-ligatures:none; }
  .ln-row { position:relative; padding-left:calc(var(--gw, 3ch) + var(--s-600)); padding-right:var(--s-400);
    min-height:var(--lh-300); white-space:pre; width:max-content; min-width:100%; }
  .code.wrap .ln-row { white-space:pre-wrap; overflow-wrap:anywhere; width:auto; }
  .ln-row::before { content:attr(data-n); display:inline-block; box-sizing:border-box; position:sticky; left:0; z-index:1;
    width:calc(var(--gw, 3ch) + var(--s-600)); margin-left:calc(-1 * (var(--gw, 3ch) + var(--s-600)));
    padding-right:var(--s-400); text-align:right; color:var(--fg-muted); background:var(--surface);
    font-variant-numeric:tabular-nums; user-select:none; -webkit-user-select:none; cursor:pointer; vertical-align:top; }
  .ln-row:hover::before { color:var(--fg); }
  /* The line a link pointed at (name.py:120), or the one clicked in the gutter. */
  .ln-row.is-marked { background:color-mix(in srgb, var(--match-bg) 45%, var(--surface)); }
  .ln-row.is-marked::before { color:var(--match-fg); background:var(--match-bg); font-weight:600; }
  /* Diff rows, the same washes as the Changes tab. */
  .ln-row.r-ins, .ln-row.r-ins::before { background:var(--c-success-bg); }
  .ln-row.r-del, .ln-row.r-del::before { background:var(--c-danger-bg); }
  .ln-row.r-hunk, .ln-row.r-hunk::before { background:var(--c-progress-bg); color:var(--c-progress-fg); }
  .tk-kw { color:var(--code-kw); }
  .tk-str { color:var(--code-str); }
  .tk-num, .tk-bi { color:var(--code-num); }
  .tk-fn { color:var(--code-fn); }
  .tk-ty { color:var(--code-ty); }
  .tk-attr { color:var(--code-attr); }
  .tk-meta { color:var(--code-meta); }
  .tk-tag { color:var(--code-tag); }
  .tk-com { color:var(--code-com); font-style:italic; }
  .tk-ts { color:var(--code-com); }
  .tk-hd, .tk-strong, .tk-dh { font-weight:600; }
  .tk-hd { color:var(--code-kw); }
  .tk-em { font-style:italic; }
  .tk-lv { font-weight:600; color:var(--fg-subtle); }
  .tk-err { color:var(--c-danger-fg); font-weight:600; }
  .tk-warn { color:var(--c-warning-fg); font-weight:600; }
  mark.cmt-hl [class^="tk-"] { color:inherit; }

  /* A table of comma- or tab-separated values. */
  .csv-wrap { overflow:auto; width:fit-content; max-width:100%; border:1px solid var(--border); border-radius:var(--r-200); max-height:calc(100vh - 140px); }
  table.csv { border-collapse:collapse; font-size:var(--fs-200); font-variant-numeric:tabular-nums; }
  table.csv th, table.csv td { border-bottom:1px solid var(--border); border-right:1px solid var(--border);
    padding:var(--s-100) var(--s-300); text-align:left; white-space:nowrap; max-width:480px; overflow:hidden; text-overflow:ellipsis; }
  table.csv thead th { position:sticky; top:0; background:var(--surface-sunken); font-weight:600; z-index:1; }
  table.csv td.n, table.csv th.n { text-align:right; }
  table.csv .rn { color:var(--fg-muted); text-align:right; background:var(--surface-sunken); user-select:none; }

  /* ---- Rendered markdown: a document, set for reading ------------------- */
  .md { max-width:820px; margin:0 auto; line-height:var(--lh-400); overflow-wrap:break-word; }
  .md p { margin:0 0 var(--s-400); }
  .md h1,.md h2,.md h3,.md h4,.md h5,.md h6 { font-weight:600; line-height:var(--lh-400); margin:var(--s-600) 0 var(--s-300); scroll-margin-top:var(--s-400); }
  .md h1 { font-size:var(--fs-500); padding-bottom:var(--s-200); border-bottom:1px solid var(--border); }
  .md h2 { font-size:var(--fs-400); padding-bottom:var(--s-100); border-bottom:1px solid var(--border); }

  p.querySelector('.cmt-quote').textContent = intro;

    return;

    const r = await fetch('/api/room/say', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ roomId: ROOM, text: body, to: '' }) });
    if (!r.ok) throw new Error(r.status);

function toast(msg) { const n = document.createElement('div'); n.className = 'cmt-toast'; n.textContent = msg; document.body.appendChild(n); setTimeout(() => n.remove(), 2800); }

// ---- Rendering ------------------------------------------------------------
// One page renders every file the tree can offer. What changes is the shape:
// highlighted source, rendered markdown, a table, a rendered page, an image, a

const byteLen = s => new TextEncoder().encode(s).length;
function fmtSize(n) {

  return (n / 1048576).toFixed(1) + ' MB';

function noteEl(lines) {

// Long lines wrap unless the reader turned it off; the choice is kept.
let WRAP = true;

const RAW_CAP = 512 * 1024;   // the fallback reader's own cap, matching the hub's
// Read at most RAW_CAP bytes of a response and stop pulling. The raw endpoint
// streams whole files with no cap of its own, so reading it with .text() would
// pull a multi-hundred-megabyte log into the page — the exact hang the workspace
// reader exists to prevent. Never trust Content-Length alone; just stop reading.
async function readCapped(res) {
  const reader = res.body && res.body.getReader ? res.body.getReader() : null;
  // No streaming body: nothing to cap against, so this branch does read the
  // whole response. Unreachable in any browser that can run the rest of this
  // page — res.body has been in Chrome since 43 — and kept only so the viewer
  // degrades rather than throws.
  if (!reader) { const t = await res.text(); return { bytes: new TextEncoder().encode(t).slice(0, RAW_CAP), truncated: t.length > RAW_CAP }; }
  const chunks = [];
  let n = 0, truncated = false;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value); n += value.length;
    if (n >= RAW_CAP) { truncated = true; try { await reader.cancel(); } catch (e) {} break; }

// Read a file as text. The workspace reader caps the read at 512 KB server-side,

// binary one can reach this page and hang it. It only accepts absolute paths
// inside the folders the dashboard may read; a relative mention from a chat link
// is not one, so those fall back to the raw reader, which resolves them against
// the room's folders — under the same cap, applied here.
async function loadText(path, rawSrc) {

  // though the raw reader resolves it.

    try {
      const r = await fetch('/api/ws/file?path=' + encodeURIComponent(path), { cache: 'no-store' });
      if (r.ok) {
        const j = await r.json();
        return { ok: true, text: j.text || '', size: j.size, truncated: !!j.truncated, binary: !!j.binary };
      }
      if (r.status === 403 || r.status === 404) return { ok: false, status: r.status };

    const binary = bytes.includes(0);

// A task link inside the dashboard (the Workspace pane) opens the task there;
// in a tab of its own it opens the dashboard in a new tab, on that task.
document.addEventListener('click', ev => {
  const a = ev.target.closest && ev.target.closest('a[data-task]');
  if (!a || ev.button !== 0 || ev.metaKey || ev.ctrlKey || ev.shiftKey) return;

  try { if (window.parent !== window && window.parent.location.origin === location.origin) host = window.parent; } catch (e) {}

// A folder, listed; each entry opens in this viewer. true when it listed it,

async function showDir(path, main) {
  let r;
  try { r = await fetch('/api/dir?path=' + encodeURIComponent(path), { cache: 'no-store' }); } catch (e) { return false; }
  if (r.status === 403) return 'forbidden';
  if (!r.ok) return false;
  const d = await r.json();
  const sep = d.path.includes('\\') ? '\\' : '/';
  const join = n => d.path.replace(/[\\\/]+$/, '') + sep + n;
  const rows = (d.parent ? [`<a class="dir-row is-dir" href="${fileHref(d.parent)}">..${sep}</a>`] : [])
    .concat((d.entries || []).map(e => e.type === 'dir'
      ? `<a class="dir-row is-dir" href="${fileHref(join(e.name))}">${esc(e.name)}${sep}</a>`
      : `<a class="dir-row" href="${fileHref(join(e.name))}">${esc(e.name)}<span class="sz">${esc(fmtSize(e.size))}</span></a>`));

function wireFrameLinks(ifr) {

      if (t.dead) { toast(`${t.dead} is an address on the hub machine itself, so it cannot open here.`); return; }

(async function () {
  const path = new URLSearchParams(location.search).get('path') || '';
  const main = document.getElementById('main');
  const nameEl = document.getElementById('name');
  const base = path.replace(/[\\/]+$/, '').split(/[\\/]/).pop() || path;
  nameEl.textContent = base;
  document.title = base || 'file';
  const src = '/api/file?path=' + encodeURIComponent(path) + CTX;
  document.getElementById('raw').href = src;
  // The hub's port, so links to its loopback address can be made this page's.
  const cfg = fetch('/api/config', { cache: 'no-store' }).then(r => r.ok ? r.json() : null)
    .then(c => { if (c && c.port) HUB_PORT = String(c.port); }).catch(() => {});

  // for every file — including the ones with no text to select in.

  if (!path) { main.innerHTML = '<div class="err">No path given.</div>'; return; }
  const ext = (base.match(/\.(\w+)$/) || [, ''])[1].toLowerCase();
  // A folder: an absolute or home (~/) path ending in a separator, or with no extension.
  const absPath = /^(?:[A-Za-z]:[\\\/]|\\\\|~\/|\/)/.test(path);
  if (absPath && (/[\\\/]$/.test(path) || !ext)) {
    const listed = await showDir(path, main);
    if (listed === true) return;
    if (listed === 'forbidden' && /[\\\/]$/.test(path)) {
      main.innerHTML = '<div class="err">Could not list this folder (403) — it sits outside the folders the dashboard is allowed to read: registered projects and their task folders.</div>';
      return;
    }
  }

  const imgExt = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'bmp', 'ico'];
  if (imgExt.includes(ext)) { main.innerHTML = `<img class="file" src="${src}" alt="${esc(base)}">`; return; }
  if (ext === 'pdf') { main.innerHTML = `<iframe class="file" src="${src}"></iframe>`; return; }

  const res = await loadText(path, src);
  if (!res.ok) {
    // A folder with a dot in its name ("C:\Users\me\.ensemble") looked like a file.

    // Say which of the two it is, rather than making the reader guess.

    else if (res.status === 403) main.innerHTML = '<div class="err">Could not open file (403) — it sits outside the folders the dashboard is allowed to read: registered projects and their task folders.</div>';
    else main.innerHTML = `<div class="err">Could not open file${res.status ? ' (' + res.status + ')' : ''}.${res.why ? ' ' + esc(res.why) : ''}</div>`;

    : isCsv ? [['table', 'Table'], ['source', 'Source']]
