<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>file</title>
<!-- Syntax highlighting: the common bundle (37 languages — python, javascript,
     typescript, xml/html, css/scss, json, yaml, markdown, bash, sql, ini/toml,
     diff) plus powershell, which the common bundle leaves out. Same CDN the
     session page already loads xterm from. If these never arrive — this hub can
     run on a tailnet with no route out — the viewer still renders the file and
     the comment layer still works; nothing is gated on them. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/powershell.min.js"></script>
<style>
  :root { --bg:#0e0e0e; --surface:#161616; --fg:#ededed; --border:#2a2a2a; --accent:#c25d3c; --dim:#9a9a9a; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg);
    font:14px/1.6 system-ui,-apple-system,sans-serif; }
  header { position:sticky; top:0; display:flex; align-items:center; gap:10px;
    padding:9px 14px; background:var(--surface); border-bottom:1px solid var(--border); z-index:5; }
  header .name { font-weight:600; font-size:13px; word-break:break-all; }
  header .grow { flex:1; }
  header a.btn { color:var(--fg); text-decoration:none; font-size:12px; border:1px solid var(--border);
    padding:4px 10px; border-radius:6px; background:#ffffff08; white-space:nowrap; }
  header a.btn:hover { background:#ffffff14; }
  header button.btn { color:var(--fg); font:inherit; font-size:12px; border:1px solid var(--border);
    padding:4px 10px; border-radius:6px; background:#ffffff08; cursor:pointer; white-space:nowrap; }
  header button.btn:hover { background:#ffffff14; }
  main { max-width:900px; margin:0 auto; padding:22px 20px 60px; }
  .err { color:#ef4444; padding:20px; }
  /* What the viewer could not do, said out loud rather than silently. */
  .note { margin:0 0 12px; padding:7px 11px; border:1px solid var(--border); border-left:3px solid var(--accent);
    border-radius:6px; background:#ffffff08; font-size:12px; color:var(--dim); }
  .note div + div { margin-top:4px; }
  pre.raw { background:#0b0b0b; border:1px solid var(--border); border-radius:8px;
    padding:14px 16px; overflow-x:auto; font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    white-space:pre; color:var(--fg); }
  /* Keep the highlighter's token colours, drop its background and padding so
     the code sits in this page's own frame. */
  .hljs { background:transparent !important; padding:0 !important; color:inherit; }
  pre.raw code { display:block; font:inherit; }
  img.file, iframe.file { max-width:100%; border:1px solid var(--border); border-radius:8px; background:#fff; }
  iframe.file { width:100%; height:calc(100vh - 120px); }
  /* Rendered markdown */
  .md { }
  .md .ln { white-space:pre-wrap; word-break:break-word; margin:0 0 2px; }
  .md .ln-gap { height:.7em; }
  .md h1,.md h2,.md h3 { font-weight:700; line-height:1.25; }
  .md h1 { font-size:24px; margin:18px 0 10px; padding-bottom:5px; border-bottom:1px solid var(--border); }
  .md h2 { font-size:19px; margin:20px 0 8px; padding-bottom:4px; border-bottom:1px solid var(--border); }
  .md h3 { font-size:16px; margin:16px 0 6px; }
  .md h4,.md h5,.md h6 { font-weight:700; font-size:14px; margin:12px 0 5px; }
  .md > :first-child { margin-top:0; }
  .md ul,.md ol { margin:6px 0; padding-left:24px; }
  .md li { margin:2px 0; }
  .md code.ic { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.9em;
    background:#ffffff14; border:1px solid #ffffff24; border-radius:4px; padding:0 4px; word-break:break-word; }
  .md pre.cb { margin:10px 0; background:#0b0b0b; border:1px solid var(--border); border-radius:8px;
    padding:10px 12px; overflow-x:auto; }
  .md pre.cb code { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px; line-height:1.45; white-space:pre; }
  .md pre.cb[data-lang]::before { content:attr(data-lang); display:block; font-size:9px;
    text-transform:uppercase; letter-spacing:.05em; color:var(--dim); margin-bottom:6px; }
  .md blockquote { margin:8px 0; padding:2px 12px; border-left:3px solid var(--border); color:var(--dim); }
  .md a { color:var(--accent); }
  .mention { color:var(--accent); font-weight:600; background:color-mix(in srgb, var(--accent) 16%, transparent); border-radius:4px; padding:0 3px; }
  .md hr { border:0; border-top:1px solid var(--border); margin:14px 0; }
  .md table { border-collapse:collapse; margin:10px 0; display:block; overflow-x:auto; }
  .md th,.md td { border:1px solid var(--border); padding:5px 9px; text-align:left; }
  .md th { background:#ffffff0d; }
  /* In-place review comments */
  mark.cmt-hl { background:#f5c84240; border-bottom:2px solid #f5c842; border-radius:2px; color:inherit; cursor:pointer; }
  .cmt-selbtn { position:fixed; z-index:60; font-size:12px; padding:5px 11px; background:var(--accent); color:#fff; border:none; border-radius:6px; box-shadow:0 3px 12px rgba(0,0,0,.4); cursor:pointer; }
  .cmt-composer { position:fixed; z-index:61; top:50%; left:50%; transform:translate(-50%,-50%); width:min(440px,92vw); background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:0 14px 44px rgba(0,0,0,.55); padding:14px; }
  .cmt-composer .cmt-quote { font-size:12px; color:var(--dim); border-left:3px solid var(--accent); padding:5px 9px; margin-bottom:9px; max-height:96px; overflow-y:auto; white-space:pre-wrap; }
  .cmt-composer textarea { width:100%; background:var(--bg); color:var(--fg); border:1px solid var(--border); border-radius:6px; padding:8px; font:inherit; resize:vertical; }
  .cmt-composer .cmt-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:10px; }
  .cmt-composer button { background:#2a2a2a; color:var(--fg); border:1px solid #444; padding:5px 12px; border-radius:6px; cursor:pointer; font:inherit; }
  .cmt-composer .cmt-add { background:var(--accent); color:#fff; border:none; }
  #cmt-tray { position:fixed; right:12px; bottom:12px; z-index:55; width:min(330px,92vw); max-height:60vh; display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:0 10px 34px rgba(0,0,0,.45); overflow:hidden; }
  #cmt-tray .cmt-tray-head { display:flex; align-items:center; gap:6px; padding:9px 11px; border-bottom:1px solid var(--border); font-size:13px; }
  #cmt-tray .grow { flex:1; }
  #cmt-tray .cmt-submit { background:var(--accent); color:#fff; border:none; padding:4px 12px; border-radius:6px; cursor:pointer; font:inherit; font-size:12px; }
  #cmt-tray .cmt-clear { background:#2a2a2a; color:var(--fg); border:1px solid #444; font-size:12px; padding:4px 10px; border-radius:6px; cursor:pointer; }
  #cmt-tray .cmt-list { overflow-y:auto; }
  #cmt-tray .cmt-item { position:relative; padding:8px 26px 8px 11px; border-bottom:1px solid var(--border); cursor:pointer; }
  #cmt-tray .cmt-item:hover { background:#ffffff08; }
  #cmt-tray .cmt-item-q { font-size:11px; color:var(--accent); margin-bottom:2px; word-break:break-word; }
  #cmt-tray .cmt-item-n { font-size:12px; color:var(--fg); word-break:break-word; }
  #cmt-tray .cmt-item-x { position:absolute; top:6px; right:6px; background:none; border:none; color:var(--dim); cursor:pointer; font-size:12px; padding:2px 5px; }
  #cmt-tray .cmt-item-x:hover { color:#ef4444; }
  .cmt-toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); z-index:70; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:9px 16px; font-size:13px; box-shadow:0 8px 26px rgba(0,0,0,.5); }
</style>
</head>
<body>
<header>
  <span class="name" id="name">file</span>
  <span class="grow"></span>
  <button class="btn" id="mode" hidden></button>
  <button class="btn" id="cmt-file" title="Comment on this file as a whole">💬 Comment</button>
  <a class="btn" id="raw" target="_blank">Raw</a>
</header>
<main id="main"><div class="err">Loading…</div></main>
<script>
const esc = s => (s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const _MDA = String.fromCharCode(0xE000), _MDZ = String.fromCharCode(0xE001);
const ROOM = new URLSearchParams(location.search).get('room') || '';
// Which task's chat the comments will land in, named so the sender can see it
// before they press the button.
const ROOM_NAME = new URLSearchParams(location.search).get('roomName') || '';
// File links: absolute paths always; relative ones ("docs/plan.md", "NOTES.md")
// are resolved against the task folder, so agents needn't spell out full paths.
const ABS_PATH_RE = /^(?:[A-Za-z]:[\\\/]|\\\\|~\/|\/)/;   // C:\dir, C:/dir, \\unc, ~/x, /x
// mdToHtml escapes before linkifying, so a path arrives with entities in it.
const unescPath = s => (s || '').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
  .replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&');
const REL_PATH_RE = /(^|[\s(*_])((?:\.\.?[\\\/])?(?:[\w.-]+[\\\/])+[\w.-]+\.\w{1,8}|[\w-]+\.(?:md|txt|py|js|ts|tsx|jsx|html|css|json|yaml|yml|toml|csv|pdf|png|jpg|jpeg|gif|svg|sh|ps1|sql|xml|log|ini|cfg))(?=[\s.,;:)\]]|$)/g;
const looksFilePath = s => {
  const t = (s || '').trim();
  if (ABS_PATH_RE.test(t)) return /\S+\.\w{1,8}$/.test(t);
  return /^(?:\.\.?[\\\/])?(?:[\w.-]+[\\\/])+[\w.-]+\.\w{1,8}$/.test(t)
      || /^[\w-]+\.(?:md|txt|py|js|ts|tsx|jsx|html|css|json|yaml|yml|toml|csv|pdf|png|jpg|jpeg|gif|svg|sh|ps1|sql|xml|log|ini|cfg)$/.test(t);
};
function resolvePath(p, base) {
  p = (p || '').trim();
  if (ABS_PATH_RE.test(p) || !base) return p;
  const sep = base.includes('\\') ? '\\' : '/';
  return base.replace(/[\\\/]+$/, '') + sep + p.replace(/^\.[\\\/]/, '').replace(/[\\\/]/g, sep);
}
const looksPath = looksFilePath;
// Relative links inside a document resolve against the document's own folder.
const FILE_BASE = (new URLSearchParams(location.search).get('path') || '').replace(/[\\\/][^\\\/]*$/, '');
const CWD = new URLSearchParams(location.search).get('cwd') || '';
const CTX = (ROOM ? '&room=' + encodeURIComponent(ROOM) : '') + (CWD ? '&cwd=' + encodeURIComponent(CWD) : '');
function fileLink(p) { return '/fileview?path=' + encodeURIComponent(resolvePath(unescPath(p), FILE_BASE)) + CTX; }
function mdToHtml(src) {
  const codes = [];
  const ph = h => _MDA + (codes.push(h) - 1) + _MDZ;
  let s = (src ?? '').replace(/\r\n/g, '\n');
  s = s.replace(/```([\w+-]*)\n?([\s\S]*?)```/g, (_, lang, body) =>
    ph(`<pre class="cb"${lang ? ` data-lang="${esc(lang)}"` : ''}><code>${esc(body.replace(/\n$/, ''))}</code></pre>`));
  s = s.replace(/`([^`\n]+)`/g, (_, body) => {
    const t = body.trim();
    if (looksPath(t)) return ph(`<a href="${fileLink(t)}" target="_blank" rel="noopener"><code class="ic">${esc(body)}</code></a>`);
    return ph(`<code class="ic">${esc(body)}</code>`);
  });
  s = esc(s);
  const inline = t => t
    .replace(/\[([^\]\n]+)\]\(([^)\n]+)\)/g, (m, txt, url) => {
      const t = url.trim();
      if (/^(?:https?:|mailto:|#)/i.test(t)) return `<a href="${t}" target="_blank" rel="noopener">${txt}</a>`;
      return looksFilePath(t) ? `<a href="${fileLink(t)}" target="_blank" rel="noopener" class="file-link">${txt}</a>` : m;
    })
    .replace(/(^|[\s(*_])((?:https?:\/\/)[^\s<)*]+)/g, (_, pre, url) => `${pre}<a href="${url}" target="_blank" rel="noopener">${url}</a>`)
    .replace(/(^|[\s(*_])((?:[A-Za-z]:[\\\/]|\\\\|~\/|\/)[^\s"'<>|?*,;)\]]*\.\w{1,8})/g,
      (_, pre, pth) => `${pre}<a href="${fileLink(pth)}" target="_blank" rel="noopener">${pth}</a>`)
    .replace(REL_PATH_RE, (_, pre, pth) => `${pre}<a href="${fileLink(pth)}" target="_blank" rel="noopener">${pth}</a>`)
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?]|$)/g, '$1<em>$2</em>')
    .replace(/(^|[\s(])_([^_\n]+)_(?=[\s).,!?]|$)/g, '$1<em>$2</em>')
    .replace(/(^|[\s(])@([a-zA-Z][\w-]*)/g, '$1<span class="mention">@$2</span>');
  const isBlockPh = t => new RegExp('^' + _MDA + '(\\d+)' + _MDZ + '$').test(t) && /^<pre/.test(codes[+t.slice(1, -1)] || '');
  const out = [];
  let list = null;
  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  const tableSep = l => /^[\s|:-]+$/.test(l.trim()) && l.includes('|') && l.includes('-');
  const rowCells = l => { let r = l.trim(); if (r.startsWith('|')) r = r.slice(1); if (r.endsWith('|')) r = r.slice(0, -1); return r.split('|').map(c => c.trim()); };
  const lines = s.split('\n');
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const t = line.trim();
    let m;
    if (isBlockPh(t)) { closeList(); out.push(t); continue; }
    if (line.includes('|') && i + 1 < lines.length && tableSep(lines[i + 1])) {
      closeList();
      const heads = rowCells(line);
      const aligns = rowCells(lines[i + 1]).map(c => { const L = c.startsWith(':'), R = c.endsWith(':'); return (L && R) ? 'center' : R ? 'right' : L ? 'left' : ''; });
      const body = [];
      let j = i + 2;
      while (j < lines.length && lines[j].includes('|') && lines[j].trim() !== '') { body.push(rowCells(lines[j])); j++; }
      const cell = (c, tag, al) => `<${tag}${al ? ` style="text-align:${al}"` : ''}>${inline(c || '')}</${tag}>`;
      let tbl = '<table><thead><tr>' + heads.map((h, k) => cell(h, 'th', aligns[k])).join('') + '</tr></thead>';
      if (body.length) tbl += '<tbody>' + body.map(row => '<tr>' + heads.map((_, k) => cell(row[k], 'td', aligns[k])).join('') + '</tr>').join('') + '</tbody>';
      out.push(tbl + '</table>');
      i = j - 1;
      continue;
    }
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { closeList(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { closeList(); out.push('<hr>'); continue; }
    if ((m = line.match(/^\s*>\s?(.*)$/))) { closeList(); out.push(`<blockquote>${inline(m[1])}</blockquote>`); continue; }
    if ((m = line.match(/^\s*[-*+]\s+(.*)$/))) { if (list !== 'ul') { closeList(); out.push('<ul>'); list = 'ul'; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { if (list !== 'ol') { closeList(); out.push('<ol>'); list = 'ol'; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    if (t === '') { closeList(); if (out.length && out[out.length - 1] !== '<div class="ln-gap"></div>') out.push('<div class="ln-gap"></div>'); continue; }
    closeList(); out.push(`<div class="ln">${inline(line)}</div>`);
  }
  closeList();
  return out.join('\n').replace(new RegExp(_MDA + '(\\d+)' + _MDZ, 'g'), (_, i) => codes[+i]);
}
// ---- In-place review comments (same idea as the chat bubbles) -----------
// Select text in the document → attach a comment; collect several; send them
// all to the room the file was opened from (carried in ?room=), or copy them.
const CMTS = [];               // {cid, start, end, quote, note}
let _cseq = 1, _composerOpen = false, _selBtn = null, _cRoot = null;
function _off(root, node, o) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null); let off = 0, n;
  while ((n = w.nextNode())) { if (n === node) return off + o; off += n.nodeValue.length; }
  return -1;
}
function _mark(root, start, end, cid) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null); let off = 0, n; const ts = [];
  while ((n = w.nextNode())) { const len = n.nodeValue.length, s = Math.max(start, off), e = Math.min(end, off + len); if (s < e) ts.push({ node: n, s: s - off, e: e - off }); off += len; }
  for (const t of ts.reverse()) { try { const r = document.createRange(); r.setStart(t.node, t.s); r.setEnd(t.node, t.e); const m = document.createElement('mark'); m.className = 'cmt-hl'; m.dataset.cid = cid; r.surroundContents(m); } catch (e) {} }
}
function clearHl() { document.querySelectorAll('mark.cmt-hl').forEach(m => { const p = m.parentNode; while (m.firstChild) p.insertBefore(m.firstChild, m); p.removeChild(m); p.normalize(); }); }
function hideSelBtn() { if (_selBtn) { _selBtn.remove(); _selBtn = null; } }
function _onSel() {
  setTimeout(() => {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) { hideSelBtn(); return; }
    const r = sel.getRangeAt(0);
    if (!_cRoot || !_cRoot.contains(r.commonAncestorContainer)) { hideSelBtn(); return; }
    let start = _off(_cRoot, r.startContainer, r.startOffset), end = _off(_cRoot, r.endContainer, r.endOffset);
    if (start > end) { const t = start; start = end; end = t; }
    if (start < 0 || end <= start) { hideSelBtn(); return; }
    showSelBtn(r.getBoundingClientRect(), { start, end, quote: (_cRoot.textContent || '').slice(start, end) });
  }, 10);
}
function showSelBtn(rect, data) {
  hideSelBtn();
  const b = document.createElement('button'); b.className = 'cmt-selbtn'; b.textContent = '💬 Comment';
  document.body.appendChild(b);
  b.style.top = (rect.bottom + 6) + 'px'; b.style.left = Math.max(6, Math.min(rect.left, window.innerWidth - 130)) + 'px';
  b.addEventListener('mousedown', e => e.preventDefault());
  b.onclick = () => { hideSelBtn(); openComposer(data); };
  _selBtn = b;
}
// data.start < 0 means a comment on the file as a whole — the only kind an
// image, a PDF or a rendered page can carry, and always available from the
// header button whatever the file turns out to be.
function openComposer(data) {
  _composerOpen = true;
  const whole = data.start < 0;
  const q = data.quote.length > 200 ? data.quote.slice(0, 200) + '…' : data.quote;
  const p = document.createElement('div'); p.className = 'cmt-composer';
  p.innerHTML = `<div class="cmt-quote"></div><textarea class="cmt-note" rows="3" placeholder="${whole ? 'Your comment on this file…' : 'Your comment on this passage…'}"></textarea><div class="cmt-actions"><button class="cmt-cancel">Cancel</button><button class="cmt-add">Add comment</button></div>`;
  p.querySelector('.cmt-quote').textContent = whole ? 'On this file as a whole' : '“' + q + '”';
  document.body.appendChild(p);
  const ta = p.querySelector('.cmt-note'); ta.focus();
  const close = () => { p.remove(); _composerOpen = false; };
  p.querySelector('.cmt-cancel').onclick = close;
  p.querySelector('.cmt-add').onclick = () => {
    const note = ta.value.trim(); if (!note) { ta.focus(); return; }
    const cid = _cseq++; CMTS.push({ cid, start: data.start, end: data.end, quote: data.quote, note });
    if (!whole && _cRoot) _mark(_cRoot, data.start, data.end, cid);
    close(); renderTray();
    const s = window.getSelection(); if (s) s.removeAllRanges();
  };
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); p.querySelector('.cmt-add').click(); } if (e.key === 'Escape') { e.preventDefault(); close(); } });
}
function renderTray() {
  let tray = document.getElementById('cmt-tray');
  if (!CMTS.length) { if (tray) tray.remove(); return; }
  if (!tray) { tray = document.createElement('div'); tray.id = 'cmt-tray'; document.body.appendChild(tray); }
  const dest = ROOM ? (ROOM_NAME ? 'Send to “' + ROOM_NAME + '”' : 'Send to chat') : 'Copy';
  tray.innerHTML = `<div class="cmt-tray-head"><strong>${CMTS.length} comment${CMTS.length > 1 ? 's' : ''}</strong><span class="grow"></span><button class="cmt-submit" title="${ROOM ? esc(dest) : 'No task chat owns this file — copy the comments instead'}">${esc(dest)}</button><button class="cmt-clear">Clear</button></div><div class="cmt-list"></div>`;
  const list = tray.querySelector('.cmt-list');
  CMTS.forEach(c => {
    const it = document.createElement('div'); it.className = 'cmt-item'; it.dataset.cid = c.cid;
    const q = document.createElement('div'); q.className = 'cmt-item-q';
    q.textContent = c.start < 0 ? 'this file' : '“' + (c.quote.length > 60 ? c.quote.slice(0, 60) + '…' : c.quote) + '”';
    const nn = document.createElement('div'); nn.className = 'cmt-item-n'; nn.textContent = c.note;
    const x = document.createElement('button'); x.className = 'cmt-item-x'; x.textContent = '✕';
    it.append(q, nn, x);
    x.onclick = (e) => { e.stopPropagation(); const i = CMTS.findIndex(z => z.cid === c.cid); if (i >= 0) CMTS.splice(i, 1); clearHl(); remarkAll(); renderTray(); };
    it.onclick = () => { const m = document.querySelector(`mark.cmt-hl[data-cid="${c.cid}"]`); if (m) m.scrollIntoView({ behavior: 'smooth', block: 'center' }); };
    list.appendChild(it);
  });
  tray.querySelector('.cmt-submit').onclick = submitCmts;
  tray.querySelector('.cmt-clear').onclick = () => { CMTS.length = 0; clearHl(); renderTray(); };
}
// Re-apply the highlights for every comment that has a passage. Called after
// anything replaces the comment root's content — switching an HTML file between
// preview and source, or removing one comment from the tray.
function remarkAll() {
  if (!_cRoot) return;
  CMTS.forEach(c => { if (c.start >= 0) _mark(_cRoot, c.start, c.end, c.cid); });
}
function buildBody() {
  const base = document.getElementById('name').textContent || 'file';
  const path = new URLSearchParams(location.search).get('path') || '';
  return `## Review comments on \`${base}\` (${CMTS.length})\nFile: \`${path}\`\n\n` +
    CMTS.map((c, i) => c.start < 0
      ? `**${i + 1}.** (on the file as a whole)\n\n${c.note}`
      : `**${i + 1}.** > ${c.quote.replace(/\s*\n\s*/g, ' ').trim()}\n\n${c.note}`).join('\n\n');
}
// No alert() and no reliance on the clipboard: this page runs inside the
// workspace panel's iframe, where a modal freezes the parent page too and
// clipboard writes can be refused outright. Show the text and let it be copied.
function showFallback(intro, body) {
  const p = document.createElement('div'); p.className = 'cmt-composer';
  p.innerHTML = `<div class="cmt-quote"></div><textarea class="cmt-note" rows="9"></textarea><div class="cmt-actions"><button class="cmt-cancel">Close</button></div>`;
  p.querySelector('.cmt-quote').textContent = intro;
  const ta = p.querySelector('.cmt-note');
  ta.value = body;
  document.body.appendChild(p);
  ta.focus(); ta.select();
  p.querySelector('.cmt-cancel').onclick = () => p.remove();
}
async function submitCmts() {
  if (!CMTS.length) return;
  const body = buildBody();
  if (!ROOM) {
    try { await navigator.clipboard.writeText(body); toast('No task chat to send to — comments copied.'); }
    catch (e) { showFallback('No task chat to send to. Copy your comments:', body); }
    return;
  }
  try {
    const r = await fetch('/api/room/say', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ roomId: ROOM, text: body, to: '' }) });
    if (!r.ok) throw new Error(r.status);
    CMTS.length = 0; clearHl(); renderTray(); toast('✓ Comments sent to the chat');
  } catch (e) { showFallback('Couldn’t send to the chat. Copy your comments:', body); }
}
function toast(msg) { const n = document.createElement('div'); n.className = 'cmt-toast'; n.textContent = msg; document.body.appendChild(n); setTimeout(() => n.remove(), 2800); }
let _cDocWired = false;
function enableComments(root) {
  _cRoot = root;
  root.addEventListener('mouseup', _onSel);
  root.addEventListener('touchend', _onSel);
  root.addEventListener('mousedown', hideSelBtn);
  if (_cDocWired) return;                       // one document listener, not one per render
  _cDocWired = true;
  document.addEventListener('mousedown', e => { if (_selBtn && e.target !== _selBtn) hideSelBtn(); });
}

// ---- Rendering ------------------------------------------------------------
// One page renders every file the tree can offer. What changes is the shape:
// highlighted source, rendered markdown, a rendered page, an image, a PDF — or
// a plain statement of why it cannot be shown. The comment layer is on in all
// of them.
const HL_LANG = {
  py: 'python', pyw: 'python', pyi: 'python',
  js: 'javascript', mjs: 'javascript', cjs: 'javascript', jsx: 'javascript',
  ts: 'typescript', tsx: 'typescript',
  json: 'json', jsonc: 'json', map: 'json',
  html: 'xml', htm: 'xml', xml: 'xml', svg: 'xml', xhtml: 'xml', plist: 'xml',
  css: 'css', scss: 'scss', sass: 'scss', less: 'less',
  yml: 'yaml', yaml: 'yaml',
  md: 'markdown', markdown: 'markdown',
  sh: 'bash', bash: 'bash', zsh: 'bash', ksh: 'bash',
  ps1: 'powershell', psm1: 'powershell', psd1: 'powershell',
  sql: 'sql',
  ini: 'ini', cfg: 'ini', conf: 'ini', toml: 'ini', env: 'ini', properties: 'ini',
  diff: 'diff', patch: 'diff',
  txt: 'plaintext', log: 'plaintext', text: 'plaintext',
};
const HL_MAX = 300 * 1024;      // beyond this the highlighter costs more than it gives
function hlLang(ext) { return HL_LANG[ext] || ''; }
function fmtSize(n) {
  if (n == null) return 'unknown size';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}
function noteEl(lines) {
  const d = document.createElement('div'); d.className = 'note';
  lines.forEach(t => { const l = document.createElement('div'); l.textContent = t; d.appendChild(l); });
  return d;
}
// Fill `el` with `text`, highlighted when we can. Returns a note to show, or ''.
// Never called twice on the same element: hljs rewrites innerHTML, which would
// drop every comment highlight while CMTS still held live offsets.
function highlightInto(el, text, lang) {
  el.textContent = text;
  if (!lang || typeof hljs === 'undefined' || !hljs.getLanguage(lang)) return '';
  if (text.length > HL_MAX) return `Syntax highlighting is off above ${Math.round(HL_MAX / 1024)} KB — this file is ${fmtSize(text.length)}.`;
  try { el.innerHTML = hljs.highlight(text, { language: lang, ignoreIllegals: true }).value; }
  catch (e) { el.textContent = text; }
  return '';
}
// Read a file as text. The workspace reader caps the read at 512 KB server-side,
// reports the real size, and flags binary content — so neither a huge file nor a
// binary one can reach this page and hang it. A relative mention from a chat
// link is not a workspace path, so fall back to the raw reader, which resolves
// those against the room's folders.
async function loadText(path, rawSrc) {
  try {
    const r = await fetch('/api/ws/file?path=' + encodeURIComponent(path), { cache: 'no-store' });
    if (r.ok) {
      const j = await r.json();
      return { ok: true, text: j.text || '', size: j.size, truncated: !!j.truncated, binary: !!j.binary };
    }
  } catch (e) { /* fall through to the raw reader */ }
  try {
    const r = await fetch(rawSrc, { cache: 'no-store' });
    if (!r.ok) return { ok: false, status: r.status };
    const t = await r.text();
    return { ok: true, text: t, size: t.length, truncated: false, binary: false };
  } catch (e) { return { ok: false, status: 0, why: String(e) }; }
}
(async function () {
  const path = new URLSearchParams(location.search).get('path') || '';
  const main = document.getElementById('main');
  const nameEl = document.getElementById('name');
  const base = path.replace(/[\\/]+$/, '').split(/[\\/]/).pop() || path;
  nameEl.textContent = base;
  document.title = base || 'file';
  const src = '/api/file?path=' + encodeURIComponent(path) + CTX;
  document.getElementById('raw').href = src;
  // The comment facility is wired before anything is loaded, so it is present
  // for every file — including the ones with no text to select in.
  document.getElementById('cmt-file').onclick = () => openComposer({ start: -1, end: -1, quote: '' });
  if (!path) { main.innerHTML = '<div class="err">No path given.</div>'; return; }
  const ext = (base.match(/\.(\w+)$/) || [, ''])[1].toLowerCase();

  const imgExt = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'bmp', 'ico'];
  if (imgExt.includes(ext)) { main.innerHTML = `<img class="file" src="${src}" alt="${esc(base)}">`; return; }
  if (ext === 'pdf') { main.innerHTML = `<iframe class="file" src="${src}"></iframe>`; return; }

  const res = await loadText(path, src);
  if (!res.ok) {
    main.innerHTML = res.status === 404
      ? '<div class="err">Could not open file (404). It may not exist on the hub, or it may sit outside the folders the dashboard is allowed to read.</div>'
      : `<div class="err">Could not open file${res.status ? ' (' + res.status + ')' : ''}.${res.why ? ' ' + esc(res.why) : ''}</div>`;
    return;
  }
  if (res.binary) {
    main.innerHTML = '';
    main.appendChild(noteEl([`This file is binary (${fmtSize(res.size)}), so it can't be shown as text.`,
                             'Use Raw to download it. You can still comment on it as a whole.']));
    return;
  }
  const notes = [];
  if (res.truncated) notes.push(`Showing the first 512 KB of ${fmtSize(res.size)} — use Raw for the whole file.`);

  // Highlight first, then hand the finished element to the comment layer: its
  // offsets are counted through the element's text, and hljs leaves text exactly
  // as it found it.
  function renderCode(text, lang) {
    main.innerHTML = '';
    const pre = document.createElement('pre'); pre.className = 'raw';
    const code = document.createElement('code');
    const hlNote = highlightInto(code, text, lang);
    pre.appendChild(code);
    const all = notes.concat(hlNote ? [hlNote] : []);
    if (all.length) main.appendChild(noteEl(all));
    main.appendChild(pre);
    enableComments(code);
    remarkAll();
  }

  if (ext === 'html' || ext === 'htm') {
    // A page is more useful rendered, so that stays the default — but the
    // source is one click away and carries in-place comments, and the header's
    // whole-file comment works in either.
    const btn = document.getElementById('mode');
    btn.hidden = false;
    let mode = 'preview';
    const paint = () => {
      btn.textContent = mode === 'preview' ? '</> Source' : '👁 Preview';
      if (mode === 'source') { renderCode(res.text, 'xml'); return; }
      _cRoot = null;
      main.innerHTML = '';
      if (notes.length) main.appendChild(noteEl(notes));
      const ifr = document.createElement('iframe');
      ifr.className = 'file';
      ifr.setAttribute('sandbox', 'allow-same-origin');   // styles and fonts load, scripts don't
      ifr.style.height = 'calc(100vh - 150px)';
      ifr.srcdoc = res.text;
      main.appendChild(ifr);
    };
    btn.onclick = () => { clearHl(); mode = mode === 'preview' ? 'source' : 'preview'; paint(); };
    paint();
    return;
  }

  if (ext === 'md' || ext === 'markdown') {
    const div = document.createElement('div');
    div.className = 'md';
    div.innerHTML = mdToHtml(res.text);
    // Fenced blocks get the same treatment as a source file — before the
    // comment layer is attached, and only once.
    div.querySelectorAll('pre.cb > code').forEach(cd => {
      highlightInto(cd, cd.textContent, hlLang((cd.parentNode.dataset.lang || '').toLowerCase()));
    });
    main.innerHTML = '';
    if (notes.length) main.appendChild(noteEl(notes));
    main.appendChild(div);
    enableComments(div);
    remarkAll();
    return;
  }

  renderCode(res.text, hlLang(ext));
})();
</script>
</body>
</html>
