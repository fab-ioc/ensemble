<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>file</title>
<!-- Syntax highlighting is this page's own (HL, below), coloured by the
     --code-* tokens of each theme. Nothing is fetched from a CDN: the hub is
     read over a tailnet that may have no route out, and a highlighter that
     never arrived left every file grey. -->
<script>
// Appearance, resolved before first paint so the page never flashes the wrong
// theme. A theme is a complete token set under :root[data-theme="<name>"].
// Light is the default whatever the OS says; "system" follows the OS between
// Light and Dark. The choice follows the person, not the browser: it lives on
// the hub (settings.theme), and localStorage['cd-theme'] is only its
// first-paint cache. index.html, session.html and fileview.html carry the same
// script; change all three together.
(function () {
  var SCHEME = { light: 'light', dark: 'dark', dim: 'dark', paper: 'light', contrast: 'light', fjord: 'dark' };
  var mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
  function stored() {
    try { return localStorage.getItem('cd-theme') || 'light'; } catch (e) { return 'light'; }
  }
  function apply() {
    var pref = stored();
    var name = pref === 'system' ? (mq && mq.matches ? 'dark' : 'light') : (SCHEME[pref] ? pref : 'light');
    var root = document.documentElement;
    root.dataset.theme = name;
    root.dataset.scheme = SCHEME[name];
    try { window.dispatchEvent(new CustomEvent('cd-theme', { detail: { pref: pref, theme: name } })); } catch (e) {}
  }
  // The accent colour follows the person the same way: settings.accent on the
  // hub, localStorage['cd-accent'] its first-paint cache. Nothing stored, or
  // the hub's "default", keeps the theme's own accent. The text on a custom
  // accent is picked from the accent itself, so a primary button stays
  // readable in every theme (dark themes put dark text on their pale accent).
  var ink = null;
  function storedAccent() {
    try { return localStorage.getItem('cd-accent') || ''; } catch (e) { return ''; }
  }
  // [r, g, b] of an opaque CSS colour, or null when the browser does not take
  // it or it is see-through (no text colour is sure to read on that).
  function rgbOf(color) {
    try {
      ink = ink || document.createElement('canvas').getContext('2d');
      // A colour the canvas refuses leaves the previous one: two different
      // starting colours then read back differently.
      ink.fillStyle = '#010203'; ink.fillStyle = String(color || '');
      var v = String(ink.fillStyle), m;
      ink.fillStyle = '#040506'; ink.fillStyle = String(color || '');
      if (String(ink.fillStyle) !== v) return null;
      if ((m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(v))) {
        return [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)];
      }
      m = v.match(/[\d.]+/g);
      if (!m || m.length < 3 || (m.length > 3 && +m[3] < 1)) return null;
      return [+m[0], +m[1], +m[2]];
    } catch (e) { return null; }
  }
  // The text colour on the accent that clears 4.5:1: white or the near-black
  // #101214, whichever reads better, and pure black for the mid tones where
  // neither does (black clears 4.6:1 on every one of those).
  function accentFg(rgb) {
    function lin(v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
    function lum(c) { return 0.2126 * lin(c[0]) + 0.7152 * lin(c[1]) + 0.0722 * lin(c[2]); }
    var L = lum(rgb) + 0.05, onWhite = 1.05 / L, onInk = L / (lum([16, 18, 20]) + 0.05);
    if (Math.max(onWhite, onInk) >= 4.5) return onWhite >= onInk ? '#FFFFFF' : '#101214';
    return '#000000';
  }
  function applyAccent() {
    var color = storedAccent(), rgb = color ? rgbOf(color) : null;
    var s = document.documentElement.style;
    if (rgb) {
      s.setProperty('--accent', color);
      s.setProperty('--accent-fg', accentFg(rgb));
    } else {
      s.removeProperty('--accent');
      s.removeProperty('--accent-fg');
    }
    try { window.dispatchEvent(new CustomEvent('cd-accent', { detail: { accent: rgb ? color : '' } })); } catch (e) {}
  }
  function put(body) {
    return fetch('/api/settings', { method: 'PUT', headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify(body) });
  }
  // A choice made here is not undone by a hub reply that was already on its
  // way: `epoch` moves with every choice (here or in another tab) and every
  // finished save, and sync() takes the hub's accent only when it did not move
  // while the reply was out and every choice has been saved.
  var epoch = 0, chosen = 0, saved = 0, saving = false, queued = null;
  function chooseAccent(color) {
    try { if (color) localStorage.setItem('cd-accent', color); else localStorage.removeItem('cd-accent'); } catch (e) {}
    epoch++; chosen++;
    applyAccent();
  }
  // Saves reach the hub one at a time and only the newest waiting one is sent,
  // so the hub ends on the last choice. Resolves with the hub's settings, or
  // with null when a newer save took this one's place.
  function saveAccent(color) {
    return new Promise(function (resolve, reject) {
      if (queued) queued.resolve(null);
      queued = { want: color || 'default', chosen: chosen, resolve: resolve, reject: reject };
      pump();
    });
  }
  function pump() {
    if (saving || !queued) return;
    var job = queued;
    queued = null; saving = true;
    put({ accent: job.want }).then(function (r) {
      return r.json().catch(function () { return null; }).then(function (b) {
        if (!r.ok) throw new Error(r.status + ' ' + (b ? JSON.stringify(b) : ''));
        return b;
      });
    }).then(job.resolve, job.reject).then(function () {
      saving = false; saved = Math.max(saved, job.chosen); epoch++;
      pump();
    });
  }
  // Adopt the hub's choices, which another device may have changed. If the hub
  // has none yet, hand it this browser's so a choice made before is kept.
  function sync() {
    var at = epoch;
    fetch('/api/settings', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (s) {
        if (!s) return;
        if (typeof s.theme === 'string') {
          var local = stored();
          if (s.theme && s.theme !== local) {
            try { localStorage.setItem('cd-theme', s.theme); } catch (e) {}
            apply();
          } else if (!s.theme && local !== 'light') {
            put({ theme: local }).catch(function () {});
          }
        }
        // A hub from before the accent was synced sends none: leave it be.
        var settled = at === epoch && !saving && !queued && saved === chosen;
        if (typeof s.accent === 'string' && settled) {
          var mine = storedAccent(), want = s.accent === 'default' ? '' : s.accent;
          if (s.accent && want !== mine) {
            try {
              if (want) localStorage.setItem('cd-accent', want); else localStorage.removeItem('cd-accent');
            } catch (e) {}
            applyAccent();
          } else if (!s.accent && mine && rgbOf(mine)) {
            saveAccent(mine).catch(function () {});
          }
        }
      }).catch(function () {});
  }
  window.cdTheme = { apply: apply, sync: sync, stored: stored, scheme: SCHEME,
                     applyAccent: applyAccent, storedAccent: storedAccent, rgbOf: rgbOf, put: put,
                     chooseAccent: chooseAccent, saveAccent: saveAccent };
  apply();
  applyAccent();
  if (mq && mq.addEventListener) mq.addEventListener('change', apply);
  window.addEventListener('storage', function (ev) {
    if (ev.key === 'cd-theme') apply();
    if (ev.key === 'cd-accent') { epoch++; applyAccent(); }
  });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) sync(); });
  sync();
})();
</script>

  /* ---- Code: an editor, not a card ---------------------------------------

    if (res.status === 404) notFound();
    else if (res.status === 403) main.innerHTML = '<div class="err">Could not open file (403) — it sits outside the folders the dashboard is allowed to read: registered projects and their task folders.</div>';
    else main.innerHTML = `<div class="err">Could not open file${res.status ? ' (' + res.status + ')' : ''}.${res.why ? ' ' + esc(res.why) : ''}</div>`;
    return;
  }
  if (res.binary) {
    main.innerHTML = '';
    main.appendChild(noteEl([`This file is binary (${fmtSize(res.size)}), so it can't be shown as text.`,
                             'Use Raw to download it. You can still comment on it as a whole.']));
    return;
  }
  const text = res.text;
  const notes = [];
  // Everything about size is counted in bytes: res.size is bytes, and a
  // character count would under-report any file that isn't pure ASCII. How much
  // came back IS the hub's read cap, so quote that rather than a number
  // hard-coded here, which would start lying the day the cap moves.
  if (res.truncated) notes.push(`Showing the first ${fmtSize(byteLen(text))} of ${fmtSize(res.size)} — use Raw for the whole file.`);
  const lang = HL.langOf(base, text);
  const metaEl = document.getElementById('meta');
  const setMeta = detail => { metaEl.textContent = [detail, fmtSize(res.size)].filter(Boolean).join(' · '); };
  const linesOf = n => n.toLocaleString() + (n === 1 ? ' line' : ' lines');

  // The ways to show this file, the first one the default. A link to a line
  // wants the source, since that is where line numbers are.
  const isMd = lang === 'markdown', isHtml = ext === 'html' || ext === 'htm', isCsv = ext === 'csv' || ext === 'tsv';
  const laidOut = lang === 'json' && !['jsonl', 'ndjson'].includes(ext) ? jsonLayout(text, res.truncated) : '';
  const views = isMd || isHtml ? [['preview', 'Preview'], ['source', 'Source']]
    : isCsv ? [['table', 'Table'], ['source', 'Source']]
    : laidOut ? [['pretty', 'Formatted'], ['source', 'As written']] : null;
  let view = views && !LINE ? views[0][0] : 'source';
  if (START.view === 'source' || (views && views.some(v => v[0] === START.view))) view = START.view;
  // The marked line of each code view: the linked one to start with, then the
  // last one clicked, so it is still marked after a trip to another view.
  const marked = { source: START.marks.source || LINE, pretty: START.marks.pretty || 0 };
  // A search result's match, marked on its line until another line is marked.
  const hitNow = () => START.hit && marked.source === START.hit.line ? START.hit : null;
  const wrapBtn = document.getElementById('wrap');
  // How this tab is left, beyond its scroll position.
  stateOf = () => ({ view, wrap: WRAP, marks: { ...marked }, ...(hitNow() ? { hit: hitNow() } : {}) });

  // Highlight first, then hand the finished element to the comment layer: its
  // offsets are counted through the element's text, which is the file's text.
  function renderCode(src, lng) {
    document.body.classList.add('code-mode');
    main.innerHTML = '';
    if (notes.length) main.appendChild(noteEl(notes));
    const box = document.createElement('div');
    box.className = 'code' + (WRAP ? ' wrap' : '');
    const t0 = performance.now();
    const r = HL.rows(src, lng);
    box.style.setProperty('--gw', Math.max(2, String(r.lines).length) + 'ch');
    box.innerHTML = r.html;
    main.appendChild(box);
    void box.offsetHeight;
    window.__fvRenderMs = Math.round(performance.now() - t0);
    // A click in the gutter marks that line and puts it in the address, so the
    // link to it can be copied from "open in its own tab".
    box.addEventListener('click', ev => {
      const row = ev.target.closest && ev.target.closest('.ln-row');
      if (!row) return;
      const sel = window.getSelection();
      if (sel && !sel.isCollapsed) return;
      if (ev.clientX - box.getBoundingClientRect().left > parseFloat(getComputedStyle(row).paddingLeft)) return;
      markRow(box, +row.dataset.n, false);
      marked[view] = +row.dataset.n;
      if (view === 'source' && !hitNow()) markHit(box, null);
      report();
      // Only a line of the file as written can be linked to: a formatted JSON
      // row has no line of its own on disk.
      if (view !== 'source') return;
      try { const u = new URL(location.href); u.searchParams.set('line', row.dataset.n); history.replaceState(null, '', u); } catch (e) {}
    });
    if (marked[view]) markRow(box, marked[view], true);
    if (view === 'source' && hitNow()) markHit(box, hitNow());
    enableComments(box);
    remarkAll();
    return r.lines;
  }
  function renderMd() {
    document.body.classList.remove('code-mode');
    main.innerHTML = '';
    if (notes.length) main.appendChild(noteEl(notes));
    const div = document.createElement('div');
    div.className = 'md';
    div.innerHTML = mdToHtml(text);
    main.appendChild(div);
    enableComments(div);
    remarkAll();
  }
  // A page is more useful rendered, so that stays the default; its source is
  // one click away and carries in-place comments.
  function renderPage() {
    document.body.classList.remove('code-mode');
    _cRoot = null;
    main.innerHTML = '';
    if (notes.length) main.appendChild(noteEl(notes));
    const ifr = document.createElement('iframe');
    ifr.className = 'file';
    ifr.setAttribute('sandbox', 'allow-same-origin');   // styles and fonts load, scripts don't
    ifr.style.height = 'calc(100vh - 150px)';
    // The page scrolls inside its own document, whose scrolling this page's
    // listener does not hear: listen there, and put a reopened tab back.
    ifr.addEventListener('load', () => {
      wireFrameLinks(ifr);
      try { ifr.contentDocument.addEventListener('scroll', onScroll, true); ifr.contentDocument.addEventListener('keydown', fvOnKey, true); } catch (e) {}
      putBack();
      report();
    });
    ifr.srcdoc = text;
    main.appendChild(ifr);
  }
  const CSV_MAX = 5000;
  function renderTable() {
    document.body.classList.remove('code-mode');
    main.innerHTML = '';
    const tabs = (text.slice(0, 2000).match(/\t/g) || []).length, semis = (text.slice(0, 2000).match(/;/g) || []).length;
    const commas = (text.slice(0, 2000).match(/,/g) || []).length;
    const sep = ext === 'tsv' || tabs > commas ? '\t' : semis > commas ? ';' : ',';
    const rows = parseCsv(text, sep, CSV_MAX + 2);
    const ns = notes.slice();
    const head = rows.shift() || [];
    if (rows.length > CSV_MAX) { rows.length = CSV_MAX; ns.push(`Showing the first ${CSV_MAX.toLocaleString()} rows. Source shows all of the text.`); }
    if (ns.length) main.appendChild(noteEl(ns));
    let cols = head.length;
    rows.forEach(r => { if (r.length > cols) cols = r.length; });
    const numeric = Array.from({ length: cols }, (_, k) => rows.length > 0
      && rows.every(r => r[k] == null || r[k] === '' || /^[-+]?[\d.,]+(?:[eE][-+]?\d+)?%?$/.test(r[k].trim())));
    const cell = (tag, v, k) => `<${tag}${numeric[k] ? ' class="n"' : ''}${v && v.length > 60 ? ` title="${esc(v)}"` : ''}>${esc(v || '')}</${tag}>`;
    const wrap = document.createElement('div');
    wrap.className = 'csv-wrap';
    wrap.innerHTML = '<table class="csv"><thead><tr><th class="rn"></th>'
      + Array.from({ length: cols }, (_, k) => cell('th', head[k], k)).join('') + '</tr></thead><tbody>'
      + rows.map((r, n) => `<tr><td class="rn">${n + 1}</td>` + Array.from({ length: cols }, (_, k) => cell('td', r[k], k)).join('') + '</tr>').join('')
      + '</tbody></table>';
    main.appendChild(wrap);
    setMeta(`CSV · ${rows.length.toLocaleString()} rows · ${cols} columns`);
    enableComments(wrap);
    remarkAll();
  }
  function paint() {
    clearHl();
    hideSelBtn();
    CUR_VIEW = view;
    if (views) [...document.getElementById('views').children].forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === view)));
    wrapBtn.hidden = !(view === 'source' || view === 'pretty');
    wrapBtn.setAttribute('aria-pressed', String(WRAP));
    if (view === 'pretty') setMeta('JSON · formatted · ' + linesOf(renderCode(laidOut, 'json')));
    else if (view === 'source') setMeta(HL.label(isHtml ? 'html' : lang, ext) + ' · ' + linesOf(renderCode(text, isHtml ? 'html' : lang)));
    else if (view === 'table') renderTable();
    else if (isMd) { renderMd(); setMeta('Markdown · ' + linesOf(countLines(text))); }
    else { renderPage(); setMeta('HTML · ' + linesOf(countLines(text))); }
    report();
  }
  if (views) {
    const seg = document.getElementById('views');
    seg.hidden = false;
    views.forEach(([v, label]) => {
      const b = document.createElement('button');
      b.className = 'btn';
      b.dataset.view = v;
      b.textContent = label;
      b.onclick = () => { if (view !== v) { view = v; pendingTop = 0; paint(); } };
      seg.appendChild(b);
    });
  }
  // Wrapping changes only how the rows lay out, not the text, so comments and
  // the mark stay. The line at the top of the view stays at the top.
  document.getElementById('wrap').onclick = () => {
    WRAP = !WRAP;
    try { localStorage.setItem('cd-fv-wrap', WRAP ? '1' : '0'); } catch (e) {}
    wrapBtn.setAttribute('aria-pressed', String(WRAP));
    const box = main.querySelector('.code');
    if (!box) return;
    const r = box.getBoundingClientRect();
    const hit = document.elementFromPoint(r.left + r.width / 2, r.top + 12);
    const top = hit && hit.closest && hit.closest('.ln-row');
    box.classList.toggle('wrap', WRAP);
    if (top) box.scrollTop = top.offsetTop - 8;
    report();
  };
  if (isMd) await cfg;
  paint();
  // Put a reopened tab back where it was scrolled to, then follow the reader.
  // A rendered page is put back once it has loaded.
  if (!main.querySelector('iframe.file')) putBack();
  reporting = true;
  report();
})();
</script>
</body>
</html>
